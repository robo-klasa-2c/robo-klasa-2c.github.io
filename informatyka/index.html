<title>Robo koduje – informatyka 2c</title>

<style>
  .prog { display: inline-flex; gap: 6px; align-items: center; }
  .prog svg { width: 36px; height: 36px; background: #E3F2FD; border-radius: 8px; padding: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .seq { font-size: 46px; letter-spacing: 6px; line-height: 1.3; word-break: break-word; }
  .seq b { color: #FF7043; }
  @media (max-width: 560px) { .prog svg { width: 30px; height: 30px; } .seq { font-size: 34px; letter-spacing: 3px; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../wspolne/robo.js?v=08df0284"></script>
<script>
const { rnd, pick, shuffle, sample, coin } = Robo;
const between = (a, b) => a + rnd(b - a + 1);
const opts = (ans, pool, k = 3) => shuffle([ans, ...sample(pool.filter(x => x !== ans), k - 1)]).map(x => ({ html: x, ok: x === ans }));
const emoji = e => `<div class="emoji">${e}</div>`;
const stmt = s => `<div class="stmt">${s}</div>`;
const YN = (ok, yes = 'Tak', no = 'Nie') => [{ html: yes, ok }, { html: no, ok: !ok }];

/* ---------- Komputer ---------- */
const PARTS = [
  ['🖥️', 'monitor', 'do wyświetlania obrazu'], ['⌨️', 'klawiatura', 'do pisania liter i cyfr'], ['🖱️', 'myszka', 'do wskazywania i klikania'],
  ['🖨️', 'drukarka', 'do drukowania na papierze'], ['🎧', 'słuchawki', 'do słuchania dźwięku'], ['💻', 'laptop', 'to komputer, który można zabrać ze sobą'],
];
const KEYS = [
  ['Który klawisz robi odstęp między wyrazami?', 'Spacja'], ['Który klawisz usuwa literę przed kursorem?', 'Backspace'],
  ['Który klawisz przenosi tekst do nowej linii?', 'Enter'], ['Który klawisz trzymasz, żeby napisać wielką literę?', 'Shift'],
];
const KEY_NAMES = ['Spacja', 'Backspace', 'Enter', 'Shift'];
function genComputer(i) {
  const mode = i % 3;
  if (mode === 0) {
    const [e, w, d] = pick(PARTS);
    return { key: 'k0' + w, t: 'Co to jest?', p: 'Części komputera.', say: 'Co to jest?', prompt: emoji(e), cls: 'three',
      after: `To ${w} – ${d}.`, options: opts(w, PARTS.map(p => p[1])) };
  }
  if (mode === 1) {
    const [e, w, d] = pick(PARTS.slice(0, 5)), verb = w === 'słuchawki' ? 'służą' : 'służy', q = `Do czego ${verb} ${w}?`;
    return { key: 'k1' + w, t: q, p: 'Części komputera.', say: q, prompt: emoji(e), cls: 'list',
      after: `${w[0].toUpperCase() + w.slice(1)} ${verb} ${d}.`, options: opts(d, PARTS.slice(0, 5).map(p => p[2])) };
  }
  const [q, ans] = pick(KEYS);
  return { key: 'k2' + ans, t: q, p: 'Klawiatura.', say: q, prompt: emoji('⌨️'), cls: 'words', after: `To klawisz ${ans}.`,
    options: shuffle(KEY_NAMES).map(x => ({ html: x, ok: x === ans })) };
}

/* ---------- Kodowanie: Robo na planszy ---------- */
const N = 5, CELL = 40;
const DIRS = { '→': [0, 1], '←': [0, -1], '↓': [1, 0], '↑': [-1, 0] };
const FLIP = { '→': '←', '←': '→', '↓': '↑', '↑': '↓' };
const inside = ([r, c]) => r >= 0 && r < N && c >= 0 && c < N;
const run = (start, prog) => prog.reduce(([r, c], d) => [r + DIRS[d][0], c + DIRS[d][1]], start);
const same = (a, b) => a[0] === b[0] && a[1] === b[1];
const ROT = { '→': 0, '↓': 90, '←': 180, '↑': 270 };
const arrow = d => `<svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(${ROT[d]} 12 12)"><path d="M4 12h14M12 5.5l6.5 6.5-6.5 6.5" fill="none" stroke="#1E88E5" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`;
const progHtml = p => `<span class="prog">${p.map(arrow).join('')}<span class="sr">${p.join(' ')}</span></span>`;
function board(start, target, labels = []) {
  let s = `<rect x="0" y="0" width="${N * CELL}" height="${N * CELL}" rx="8" fill="#E3F2FD" stroke="#90CAF9" stroke-width="2"/>`;
  for (let k = 1; k < N; k++) s += `<line x1="${k * CELL}" y1="0" x2="${k * CELL}" y2="${N * CELL}" stroke="#90CAF9"/><line x1="0" y1="${k * CELL}" x2="${N * CELL}" y2="${k * CELL}" stroke="#90CAF9"/>`;
  if (target) s += `<text x="${target[1] * CELL + CELL / 2}" y="${target[0] * CELL + CELL / 2 + 10}" text-anchor="middle" font-size="28">⭐</text>`;
  labels.forEach(([r, c, t]) => {
    s += `<circle cx="${c * CELL + CELL / 2}" cy="${r * CELL + CELL / 2}" r="15" fill="#FFE082" stroke="#333" stroke-width="1.5"/>
          <text x="${c * CELL + CELL / 2}" y="${r * CELL + CELL / 2 + 7}" text-anchor="middle" font-size="19" font-weight="700" font-family="Fredoka, sans-serif" fill="#263238">${t}</text>`;
  });
  s += Robo.robot().replace(/<svg[^>]*>/, `<svg x="${start[1] * CELL + 3}" y="${start[0] * CELL + 3}" width="${CELL - 6}" height="${CELL - 6}" viewBox="0 0 100 100">`);
  return `<svg viewBox="-2 -2 ${N * CELL + 4} ${N * CELL + 4}" style="width:min(100%,250px)" aria-label="plansza">${s}</svg>`;
}
function randomTrip() {
  for (;;) {
    const start = [rnd(N), rnd(N)], dr = between(-3, 3), dc = between(-3, 3), steps = Math.abs(dr) + Math.abs(dc);
    const target = [start[0] + dr, start[1] + dc];
    if (steps >= 2 && steps <= 5 && inside(target)) {
      const h = Array(Math.abs(dc)).fill(dc > 0 ? '→' : '←'), v = Array(Math.abs(dr)).fill(dr > 0 ? '↓' : '↑');
      return { start, target, prog: coin() ? [...h, ...v] : [...v, ...h] };
    }
  }
}
function genCode(i) {
  const { start, target, prog } = randomTrip();
  if (i % 2 === 0) {
    const cands = [prog.map(d => DIRS[d][1] ? FLIP[d] : d), prog.map(d => DIRS[d][0] ? FLIP[d] : d), prog.slice(0, -1), [...prog, prog[prog.length - 1]], prog.map(d => FLIP[d])];
    const wrong = [], seen = new Set([prog.join('')]);
    for (const c of shuffle(cands)) if (c.length && !same(run(start, c), target) && !seen.has(c.join('')) && wrong.length < 2) { seen.add(c.join('')); wrong.push(c); }
    return { key: 'c0' + start + target + prog.join(''), t: 'Który program zaprowadzi Robo do gwiazdki?', p: 'Każda strzałka to jeden krok.',
      say: 'Który program zaprowadzi Robo do gwiazdki?', prompt: board(start, target), cls: 'list', after: 'Robo jest przy gwieździe!',
      review: `program ${prog.join(' ')}`, options: shuffle([prog, ...wrong]).map(p => ({ html: progHtml(p), ok: p === prog })) };
  }
  const others = [];
  while (others.length < 2) {
    const cell = [rnd(N), rnd(N)];
    if (!same(cell, start) && !same(cell, target) && !others.some(o => same(o, cell))) others.push(cell);
  }
  const letters = shuffle(['A', 'B', 'C']), labels = [[...target, letters[0]], [...others[0], letters[1]], [...others[1], letters[2]]];
  return { key: 'c1' + start + prog.join(''), t: 'Dokąd dojdzie Robo?', p: 'Wykonaj strzałki po kolei, krok po kroku.',
    say: 'Dokąd dojdzie Robo?', prompt: `<div class="row">${board(start, null, labels)}${progHtml(prog)}</div>`, cls: 'three',
    after: `Robo dojdzie do pola ${letters[0]}.`, options: ['A', 'B', 'C'].map(x => ({ html: x, ok: x === letters[0] })) };
}

/* ---------- Co dalej? (wzory) ---------- */
const SETS = [['🔴', '🔵', '🟡', '🟢'], ['🍎', '🍌', '🍇', '🍐'], ['⭐', '🌙', '☀️', '☁️'], ['🐱', '🐶', '🐭', '🐰'], ['🟥', '🟦', '🟨', '🟩']];
const UNITS = ['AB', 'ABB', 'AAB', 'ABC', 'AABB', 'ABCB'];
function genPattern(i) {
  if (i % 3 === 2) {
    const step = pick([2, 3, 5, 10]), a = between(1, 5), seq = [0, 1, 2, 3, 4].map(k => a + k * step), ans = a + 5 * step;
    const cand = [...new Set([ans + 1, ans - 1, ans + step, ans - 2, ans + 2])].filter(x => x !== ans && x > 0);
    return { key: 'p1' + a + step, t: 'Jaka liczba będzie dalej?', p: 'Znajdź regułę.', say: 'Jaka liczba będzie dalej?',
      prompt: `<div class="seq">${seq.join(', ')}, <b>?</b></div>`, cls: 'three', after: `Każda liczba jest większa o ${step}, więc następna to ${ans}.`,
      options: shuffle([ans, ...sample(cand, 2)]).map(x => ({ html: String(x), ok: x === ans })) };
  }
  const unit = pick(UNITS), set = shuffle(pick(SETS)), map = {};
  [...'ABC'].forEach((L, k) => { map[L] = set[k]; });
  const total = unit.length * 2 + 1 + rnd(unit.length);
  const seq = Array.from({ length: total }, (_, k) => map[unit[k % unit.length]]), ans = map[unit[total % unit.length]];
  const pool = set.filter(x => x !== ans);
  return { key: 'p0' + seq.join(''), t: 'Co będzie dalej?', p: 'Znajdź powtarzający się wzór.', say: 'Co będzie dalej?',
    prompt: `<div class="seq">${seq.join('')}<b>?</b></div>`, cls: 'three', after: 'Brawo! Komputery też szukają takich wzorów.',
    options: shuffle([ans, ...sample(pool, 2)]).map(x => ({ html: `<span class="emoji">${x}</span>`, ok: x === ans })) };
}

/* ---------- Bezpieczny internet ---------- */
const SAFE = [
  ['🏠', 'Nieznajomy w grze pyta, gdzie mieszkasz. Czy mu powiesz?', false, 'Nie! Nie podawaj adresu obcym. Powiedz o tym rodzicowi.'],
  ['🔑', 'Czy hasło możesz powiedzieć koledze?', false, 'Nie. Hasło znasz tylko Ty i Twoi rodzice.'],
  ['📷', 'Czy możesz wysłać swoje zdjęcie komuś, kogo nie znasz?', false, 'Nie. Zdjęć nie wysyłamy obcym osobom.'],
  ['📰', 'Czy wszystko, co jest w internecie, jest prawdą?', false, 'Nie. W internecie są też nieprawdziwe informacje.'],
  ['🎮', 'Czy możesz pobrać nową grę bez pytania rodzica?', false, 'Nie. Najpierw zapytaj rodzica.'],
  ['🙋', 'Coś w internecie Cię przestraszyło. Czy warto powiedzieć o tym rodzicowi?', true, 'Tak! Zawsze możesz powiedzieć rodzicowi lub nauczycielowi.'],
  ['⏰', 'Czy przy tablecie warto robić przerwy?', true, 'Tak. Przerwy są dobre dla oczu i dla głowy.'],
];
const SAFE_CHOICE = [
  ['😠', 'Ktoś w internecie jest dla Ciebie niemiły. Co robisz?', 'Mówię rodzicowi lub nauczycielowi', ['Mówię rodzicowi lub nauczycielowi', 'Odpisuję coś brzydkiego', 'Nikomu nic nie mówię']],
  ['🎁', 'Wyskoczyło okienko: „Wygrałeś telefon! Kliknij!”. Co robisz?', 'Nie klikam i pytam rodzica', ['Nie klikam i pytam rodzica', 'Klikam szybko', 'Wpisuję swój adres']],
  ['🔐', 'Dobre hasło to…', 'długie i trudne do zgadnięcia', ['długie i trudne do zgadnięcia', '1234', 'moje imię']],
];
function genSafe(i) {
  if (i % 3 === 2) {
    const [e, q, ans, o] = pick(SAFE_CHOICE);
    return { key: 'b1' + q, t: q, p: 'Bezpieczny internet.', say: q, prompt: emoji(e), cls: 'list', after: ans, options: opts(ans, o) };
  }
  const [e, q, ok, aft] = pick(SAFE);
  return { key: 'b0' + q, t: q, p: 'Bezpieczny internet.', say: q, prompt: emoji(e), cls: 'two', after: aft, review: aft, options: YN(ok) };
}

/* ---------- Jak uczy się AI ---------- */
const SORTS = [
  { a: 'owoc', b: 'warzywo', A: ['🍎', '🍌', '🍇', '🍓', '🍐', '🍊'], B: ['🥕', '🥦', '🥒', '🥔', '🧅', '🫑'] },
  { a: 'żyje na lądzie', b: 'żyje w wodzie', A: ['🐶', '🐱', '🐘', '🦁', '🐰', '🐻'], B: ['🐟', '🐬', '🐙', '🦈', '🐳', '🦀'] },
  { a: 'lata', b: 'jeździ', A: ['✈️', '🚁', '🚀', '🎈'], B: ['🚗', '🚌', '🚲', '🚂', '🛴'] },
];
const LEARN = [
  ['Z czego uczy się sztuczna inteligencja (AI)?', 'z wielu przykładów', ['z wielu przykładów', 'ze snu', 'z jedzenia'], 'AI uczy się z bardzo wielu przykładów.'],
  ['Robo obejrzał 100 zdjęć kotów i 100 zdjęć psów. Czego się nauczył?', 'rozpoznawać koty i psy', ['rozpoznawać koty i psy', 'gotować obiad', 'pływać'], 'Z przykładów Robo nauczył się rozpoznawać koty i psy.'],
  ['Robo uczył się tylko na zdjęciach białych kotów. Pokazujemy mu czarnego kota. Co się może stać?', 'Robo może się pomylić', ['Robo może się pomylić', 'Robo na pewno zgadnie', 'Robo zamieni się w kota'], 'Może się pomylić, bo nie widział takich przykładów. Dlatego AI potrzebuje różnych przykładów.'],
  ['Ktoś pokazał Robo psa i podpisał go „kot”. Co się stanie?', 'Robo nauczy się źle', ['Robo nauczy się źle', 'Robo nauczy się lepiej', 'Nic się nie zmieni'], 'Złe przykłady uczą AI złych odpowiedzi.'],
  ['Im więcej dobrych przykładów, tym AI…', 'lepiej rozpoznaje', ['lepiej rozpoznaje', 'gorzej rozpoznaje', 'dłużej śpi'], 'Więcej dobrych przykładów – lepsza AI.'],
];
function genLearn(i) {
  if (i % 2 === 0) {
    const s = pick(SORTS), isA = coin(), e = pick(isA ? s.A : s.B), ans = isA ? s.a : s.b;
    return { key: 'l0' + e, t: 'Robo uczy się sortować. Pomóż mu! To…', p: 'Tak AI uczy się z przykładów.', say: 'Robo uczy się sortować. Pomóż mu!',
      prompt: emoji(e), cls: 'two', after: `Dobrze: ${ans}. Dziękuję, uczę się z Twoich przykładów!`, options: [s.a, s.b].map(x => ({ html: x, ok: x === ans })) };
  }
  const [q, ans, o, aft] = pick(LEARN);
  return { key: 'l1' + q, t: q, p: 'Jak uczy się AI?', say: q, prompt: Robo.robot().replace('class="ic"', 'class="big"'), cls: 'list', after: aft, options: opts(ans, o) };
}

/* ---------- AI wokół nas ---------- */
const AROUND = [
  ['🤖', 'Co to jest AI?', 'sztuczna inteligencja – program komputerowy, który uczy się z przykładów', ['sztuczna inteligencja – program komputerowy, który uczy się z przykładów', 'nowy rodzaj czekolady', 'zwierzę z zoo'], 'AI to sztuczna inteligencja – program komputerowy.'],
  ['📱', 'Gdzie możesz spotkać AI?', 'w asystencie głosowym w telefonie', ['w asystencie głosowym w telefonie', 'w ołówku', 'w kamieniu'], 'Asystent głosowy w telefonie korzysta z AI.'],
  ['🌍', 'Co może zrobić tłumacz z AI w telefonie?', 'przetłumaczyć zdanie na inny język', ['przetłumaczyć zdanie na inny język', 'ugotować zupę', 'posprzątać pokój'], 'Tłumacz z AI zamienia zdania na inny język.'],
  ['❓', 'Czy AI zawsze ma rację?', 'Nie, może się pomylić – trzeba sprawdzać', ['Nie, może się pomylić – trzeba sprawdzać', 'Tak, nigdy się nie myli', 'Tylko w niedzielę'], 'AI też się myli. Ważne informacje sprawdzamy z dorosłym.'],
  ['💬', 'Czy możesz napisać czatbotowi swój adres i hasło?', 'Nie, to są moje prywatne dane', ['Nie, to są moje prywatne dane', 'Tak, czatbot jest moim kolegą', 'Tak, ale tylko hasło'], 'Prywatnych danych nie podajemy ani ludziom w internecie, ani czatbotom.'],
  ['📝', 'AI napisało odpowiedź do zadania domowego. Co robisz?', 'Czytam, sprawdzam i uczę się sam(a)', ['Czytam, sprawdzam i uczę się sam(a)', 'Przepisuję bez czytania', 'Wyrzucam zeszyt'], 'AI może pomóc, ale uczysz się Ty – sprawdzaj i myśl samodzielnie.'],
  ['👩‍💻', 'Kto tworzy programy AI?', 'ludzie – programiści', ['ludzie – programiści', 'roboty z kosmosu', 'dinozaury'], 'AI tworzą ludzie – programistki i programiści.'],
  ['🧠', 'Czy AI czuje radość albo smutek jak człowiek?', 'Nie, to program komputerowy', ['Nie, to program komputerowy', 'Tak, płacze w nocy', 'Tak, gdy jest głodne'], 'AI to program. Może mówić jak człowiek, ale nie czuje jak człowiek.'],
];
function genAround() {
  const [e, q, ans, o, aft] = pick(AROUND);
  return { key: 'a' + q, t: q, p: 'AI wokół nas.', say: q, prompt: emoji(e), cls: 'list', after: aft, options: opts(ans, o) };
}

Robo.start({
  id: 'robo-inf-2c', lang: 'pl-PL', rate: .95,
  title: 'Robo koduje', sub: 'Informatyka · klasa 2c',
  intro: '<b>Cześć! Jestem Robo – robot, który uczy się jak komputer.</b> Poprowadź mnie strzałkami, odgadnij wzory i dowiedz się, jak uczy się sztuczna inteligencja. Na końcu zrób <b>Lot próbny</b>.',
  back: '../',
  levels: [
    { id: 'computer', name: 'Komputer', pl: 'części i klawisze', col: '#42A5F5', ring: '#FFF59D', gen: genComputer },
    { id: 'code', name: 'Kodowanie', pl: 'strzałki na planszy', col: '#FFB300', ring: '#90CAF9', gen: genCode },
    { id: 'pattern', name: 'Co dalej?', pl: 'wzory i reguły', col: '#AB47BC', ring: '#A5D6A7', gen: genPattern },
    { id: 'safe', name: 'Bezpieczny internet', pl: 'hasła, dane, zasady', col: '#66BB6A', ring: '#F48FB1', gen: genSafe },
    { id: 'learn', name: 'Jak uczy się AI', pl: 'przykłady i sortowanie', col: '#EF5350', ring: '#FFCC80', gen: genLearn },
    { id: 'ai', name: 'AI wokół nas', pl: 'gdzie jest AI, zasady', col: '#26A69A', ring: '#CE93D8', gen: genAround },
  ],
  test: { name: 'Lot próbny', pl: '15 pytań ze wszystkiego, bez podpowiedzi.', n: 15 },
});
</script>
</body>
</html>
