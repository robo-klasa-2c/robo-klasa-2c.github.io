      <b>Monety</b> są wspólne z grą <a href="../obby/">Robo Obby</a> – tam w Szafie zmienisz wygląd postaci i kupisz czapki. Postęp zapisuje się tylko w tej przeglądarce.<br><b>Grafika:</b> „automatyczna” zaczyna od pięknej i sama przełącza się na szybszą, jeśli telefon nie nadąża. Przycisk na górze zmienia to ręcznie.</div>`;
}
menu.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  SFX.click();
  if (b.dataset.lv != null) return startLevel(+b.dataset.lv);
  if (b.dataset.a === 'gfx') { cycleQuality(); b.textContent = qLabel(); return; }
  if (b.dataset.a === 'sound') { obby.sound = !sound(); const o = load(OBBY_KEY, {}); o.sound = obby.sound; put(OBBY_KEY, o); b.textContent = sound() ? '🔊' : '🔇'; }
});
showMap();

/* debug/test hook (used by the reachability bot; harmless for players) */
window._r3d = { get G() { return G; }, I, cam, update, startLevel, showMap, stopLoop, startLoop, STEP };
</script>
