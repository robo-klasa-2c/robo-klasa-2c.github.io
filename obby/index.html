<style>
  /* Robo Obby: a blocky obstacle-course platformer drawn on a canvas; menus and quizzes are plain DOM on top. */
  body { touch-action: manipulation; }
  .wrap { max-width: 1040px; }
  .coinpill { background: #FFC107; color: #3E2723; }
  .hello .pv { width: 96px; height: 96px; flex: none; }
  .hello .act { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .planet[disabled] { opacity: .55; cursor: default; }
  .planet[disabled]:hover { transform: none; }
  .planet .lock { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .how { background: rgba(255,255,255,.1); color: #fff; border-radius: 20px; padding: 12px 18px; margin-top: 16px; font-size: 15px; line-height: 1.55; }
  .how b { color: #FFE082; }

  .hud { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: #fff; margin-bottom: 10px; }
  .hud .nm { font-family: var(--display); font-size: clamp(18px, 3vw, 24px); font-weight: 600; margin-right: auto; }
  .stage { position: relative; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 0 rgba(0,0,0,.25); background: #0d1b3e; }
  .stage canvas { display: block; width: 100%; touch-action: none; }
  .ov { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px; background: rgba(13,27,62,.55); }
  .ov[hidden] { display: none; }
  .qcard { background: #fff; color: var(--ink); border-radius: 22px; padding: 16px 18px; width: 100%; max-width: 560px; max-height: 100%; overflow: auto; text-align: center; }
  .qcard h2 { font-family: var(--display); font-size: clamp(20px, 3.4vw, 28px); margin: 0 0 4px; }
  .qcard .sub { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .qcard .q { font-size: clamp(19px, 3.4vw, 25px); font-weight: 700; margin: 8px 0; line-height: 1.35; }
  .qcard .show { font-family: var(--display); font-size: clamp(40px, 9vw, 64px); line-height: 1.15; margin: 4px 0; }
  .qcard .sw { width: 84px; height: 84px; border-radius: 18px; border: 3px solid #333; margin: 4px auto; }
  .qopts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 10px; }
  .qopts button { border: 3px solid var(--line); background: #fff; border-radius: 18px; padding: 10px; min-height: 58px; font-size: clamp(18px, 3vw, 22px); font-weight: 700; }
  .qopts button:hover { border-color: var(--accent); }
  .qopts button.ok { border-color: var(--ok); background: #E8F5E9; }
  .qopts button.bad { border-color: var(--bad); background: #FFEBEE; opacity: .55; pointer-events: none; animation: shake .4s; }
  .qopts button.hint { animation: glow 1s infinite; }
  .qcard .row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .qcard .later { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 15px; margin-top: 10px; }
  .qcard .after { color: #2E7D32; font-weight: 700; margin-top: 8px; min-height: 1.4em; }
  .bigstars { display: flex; justify-content: center; gap: 8px; margin: 6px 0; }
  .bigstars svg { width: 64px; height: 64px; }
  .res { display: grid; grid-template-columns: auto auto; gap: 2px 14px; justify-content: center; text-align: left; font-size: 17px; margin: 6px 0; }
  .toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(38,50,56,.9); color: #fff; border-radius: 14px;
           padding: 8px 14px; font-weight: 700; font-size: 15px; pointer-events: none; transition: opacity .4s; text-align: center; max-width: 90%; }
  .toast.hide { opacity: 0; }

  .ctrl { display: none; justify-content: space-between; align-items: center; margin-top: 12px; gap: 12px; user-select: none; -webkit-user-select: none; }
  /* phone controls like in blocky obby games: a thumb joystick on the left, a round jump button on the right */
  .stickzone { position: relative; flex: 1; max-width: 280px; height: 124px; border-radius: 62px; background: rgba(255,255,255,.07); touch-action: none; }
  .stick { position: absolute; left: 72px; top: 62px; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; pointer-events: none;
           background: rgba(255,255,255,.14); border: 3px solid rgba(255,255,255,.45); }
  .stick .knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px; border-radius: 50%; background: rgba(255,255,255,.88);
                 box-shadow: 0 3px 8px rgba(0,0,0,.35); }
  .stick.float { display: none; z-index: 5; } .stick.float.on { display: block; }
  .sz-hint { position: absolute; right: 16px; bottom: 10px; font-size: 12px; color: rgba(255,255,255,.6); pointer-events: none; }
  .ctrl button { width: 84px; height: 84px; border-radius: 24px; border: 0; background: rgba(255,255,255,.18); color: #fff; font-size: 40px; font-weight: 700;
                 touch-action: none; box-shadow: 0 5px 0 rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; }
  .ctrl button.on { background: rgba(255,255,255,.4); transform: translateY(2px); }
  .ctrl button.jump { width: 108px; height: 108px; border-radius: 50%; font-size: 46px; background: #43A047; border: 4px solid rgba(255,255,255,.55); }
  .ctrl button.jump.on { background: #66BB6A; }
  .keys { color: rgba(255,255,255,.75); font-size: 14px; margin-top: 10px; text-align: center; }
  @media (pointer: coarse), (max-width: 760px) { .ctrl { display: flex; } .keys { display: none; } .ov { position: fixed; z-index: 50; background: rgba(13,27,62,.8); } }

  .shop { display: grid; grid-template-columns: 220px 1fr; gap: 16px; align-items: start; }
  .shop .left { background: var(--card); border-radius: 22px; padding: 14px; text-align: center; position: sticky; top: 10px; }
  .shop .left canvas { width: 180px; height: 180px; }
  .shop .sec { background: var(--card); border-radius: 22px; padding: 14px 16px; margin-bottom: 12px; }
  .shop h3 { font-family: var(--display); margin: 0 0 8px; font-size: 21px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 3px solid var(--line); background: #fff; border-radius: 16px; padding: 6px 10px; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  .chip.sel { border-color: var(--accent); background: #E3F2FD; }
  .chip .dot { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #333; }
  .chip small { font-weight: 400; color: var(--muted); }
  .chip .price { background: #FFC107; border-radius: 10px; padding: 0 6px; font-size: 13px; }
  @media (max-width: 640px) { .shop { grid-template-columns: 1fr; } .shop .left { position: static; } .hello .act { margin-left: 0; } .hello { flex-wrap: wrap; } }
  @media (max-width: 560px) { .ctrl button.jump { width: 100px; height: 100px; } .hud { gap: 6px; } .hud .pill { padding: 5px 8px; font-size: 14px; } #hudDeaths { display: none; } .hud .nm { font-size: 17px; flex-basis: 100%; order: -1; } }
</style>
<!-- Anonymous visit counter (GoatCounter, no cookies); roboTrack(name) records an event such as a finished level. -->
<script data-goatcounter="https://robo-klasa-2c.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<script>window.roboTrack = function (n, t) { t = t || 0; try { var g = window.goatcounter; if (g && g.count) g.count({ path: n, title: n, event: true }); else if (t < 20) setTimeout(function () { roboTrack(n, t + 1); }, 500); } catch (e) {} };</script>
<!-- roboPlayer(section): once per device 'nowy gracz' on the first game start, then 'gracz wraca' at most once a day (only a date is stored). -->
<script>window.roboPlayer = function (s) { try { var k = 'robo-gracz-' + s, d = new Date().toDateString(), last = localStorage.getItem(k); if (last === d) return; localStorage.setItem(k, d); roboTrack(s + ' · ' + (last ? 'gracz wraca' : 'nowy gracz')); } catch (e) {} };</script>

<script>
'use strict';
/* ================= helpers ================= */
const T = 32, H = 14;                                  // tile size (world px) and map height in tiles
const PW = 20, PH = 28;                                // player box
const GRAV = 2000, JUMP = 660, PAD = 1000, RUN = 210;  // jump ≈ 3.4 tiles high, ≈ 4 tiles far; pad ≈ 7.8 tiles
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n), pick = a => a[rnd(a.length)], coin = () => Math.random() < .5;
const between = (a, b) => a + rnd(b - a + 1);
const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = rnd(i + 1); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const sample = (a, k) => shuffle(a).slice(0, k);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

/* ================= save (only in this browser) ================= */
const SAVE_KEY = 'robo-obby-2c';
const DEF = { stars: {}, best: {}, coins: 0, owned: ['none', 'tr-none'], sound: true,
  avatar: { style: 'kid', body: 'blue', visor: 'yellow', pants: 'black', skin: 1, hair: 'brown', hat: 'none', trail: 'none' } };
let save;
try { save = Object.assign({}, DEF, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) { save = { ...DEF }; }
save.avatar = Object.assign({}, DEF.avatar, save.avatar);
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

/* ================= sound & speech ================= */
let actx = null, voice = null;
function tone(freqs, dur = .1, type = 'square', vol = .06) {
  if (!save.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * dur;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .03);
    });
  } catch (e) {}
}
const SFX = {
  jump: () => tone([420, 640], .05, 'square', .04), coin: () => tone([988, 1319], .05, 'square', .04),
  pad: () => tone([260, 520, 900], .06, 'triangle', .08), die: () => tone([330, 220, 130], .1, 'sawtooth', .05),
  cp: () => tone([523, 659, 784, 1047], .09, 'triangle', .08), win: () => tone([523, 659, 784, 1047, 784, 1047, 1319], .11, 'triangle', .08),
  bad: () => tone([196, 165], .14, 'triangle', .08), gem: () => tone([1047, 1319, 1568, 2093], .07, 'triangle', .07), click: () => tone([700], .03, 'square', .03),
};
const ROBOTIC = /eloquence|\b(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|albert|fred|junior|kathy|ralph|zarvox|trinoids|whisper|bubbles|jester|organ|superstar|wobble|bells|boing|cellos|bahh)\b/i;
let enVoice = null;
function voiceScore(v, want) {
  const lang = (v.lang || '').toLowerCase().replace('_', '-'), id = `${v.name} ${v.voiceURI}`;
  if (!lang.startsWith(want.slice(0, 2))) return -1;
  let s = lang === want ? 100 : 50;
  if (/natural|neural/i.test(id)) s += 40; if (/premium/i.test(id)) s += 35; if (/enhanced/i.test(id)) s += 30; if (/google/i.test(id)) s += 25;
  if (ROBOTIC.test(id)) s -= 80;
  return s;
}
function loadVoice() {
  if (!('speechSynthesis' in window)) return;
  let top = -1, topEn = -1;
  speechSynthesis.getVoices().forEach(v => {
    const s = voiceScore(v, 'pl-pl'); if (s > top) { top = s; voice = v; }
    const e = voiceScore(v, 'en-gb'); if (e > topEn) { topEn = e; enVoice = v; }
  });
}
if ('speechSynthesis' in window) { loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
/* English words are marked <span lang="en">…</span> and read by an English voice; the rest by the Polish one. */
const en = w => `<span lang="en">${w}</span>`;
const strip = s => String(s || '').replace(/<[^>]+>/g, '');
function speechParts(text) {
  const s = String(text || ''), parts = [], re = /<span lang="en">([\s\S]*?)<\/span>/g;
  let at = 0;
  s.replace(re, (m, e, i) => { parts.push([s.slice(at, i), false], [e, true]); at = i + m.length; return m; });

  return parts.map(([t, e]) => [e ? strip(t).replace(/\s+/g, ' ').trim() : spokenMath(strip(t)), e]).filter(([t]) => /[\p{L}\p{N}]/u.test(t));
}
/* Voices skip "=" (so "4 − 1 = 3" sounded like "cztery minus jeden trzy"): say the signs as words. */
function spokenMath(t) {
  return t.replace(/\s*=\s*/g, ' to ').replace(/(?<=\d)\s*[−-]\s*(?=\d)/g, ' minus ').replace(/(?<=\d)\s*\+\s*(?=\d)/g, ' plus ').replace(/\s+/g, ' ').trim();
}
function say(text) {
  const parts = speechParts(text);
  if (!save.sound || !parts.length || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    for (const [t, e] of parts) {
      const u = new SpeechSynthesisUtterance(t);
      u.lang = e ? 'en-GB' : 'pl-PL'; const v = e ? enVoice : voice; if (v) u.voice = v; u.rate = e ? .9 : .95;
      speechSynthesis.speak(u);
    }
  } catch (e) {}
}
/* Run fn after at least minMs and after the reader has finished (+ a short pause); 12 s cap because some browsers never clear "speaking". */
function afterSpeech(minMs, fn) {
  const t0 = Date.now();
  let quiet = 0;
  (function check() {
    const el = Date.now() - t0, busy = save.sound && 'speechSynthesis' in window && (speechSynthesis.speaking || speechSynthesis.pending);
    quiet = busy ? 0 : quiet + 150;
    if (el >= minMs && (quiet >= 300 || el > 12000)) return fn();
    setTimeout(check, 150);
  })();
}
let unlocked = false;
document.addEventListener('pointerdown', () => {
  if (unlocked) return; unlocked = true;
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
}, { capture: true, passive: true });

/* ================= questions from the class topics ================= */
const NOM = ['', 'pierwsza', 'druga', 'trzecia', 'czwarta', 'piąta', 'szósta', 'siódma', 'ósma', 'dziewiąta', 'dziesiąta', 'jedenasta', 'dwunasta'];
const GEN = ['', 'pierwszej', 'drugiej', 'trzeciej', 'czwartej', 'piątej', 'szóstej', 'siódmej', 'ósmej', 'dziewiątej', 'dziesiątej', 'jedenastej', 'dwunastej'];
const DAYS = ['poniedziałek', 'wtorek', 'środa', 'czwartek', 'piątek', 'sobota', 'niedziela'];
const PO = ['poniedziałku', 'wtorku', 'środzie', 'czwartku', 'piątku', 'sobocie', 'niedzieli'];
const COLORS = {
  red: ['#E53935', 'czerwony'], blue: ['#1E88E5', 'niebieski'], green: ['#43A047', 'zielony'], yellow: ['#FDD835', 'żółty'],
  orange: ['#FB8C00', 'pomarańczowy'], pink: ['#F06292', 'różowy'], purple: ['#8E24AA', 'fioletowy'], white: ['#F5F5F5', 'biały'],
  black: ['#37474F', 'czarny'], grey: ['#9E9E9E', 'szary'], brown: ['#795548', 'brązowy'],
};
const NW = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen'];
const TOYS = [['⚽', 'ball'], ['🤖', 'robot'], ['🚲', 'bike'], ['🧸', 'teddy bear'], ['🚂', 'train'], ['🛴', 'scooter'], ['🚀', 'spaceship'],
  ['📺', 'TV'], ['💻', 'computer'], ['⌚', 'watch'], ['🚗', 'car'], ['🎮', 'computer game']];
const THEATRE = [['Kto ogląda przedstawienie?', 'widz'], ['Kto gra role na scenie?', 'aktor'], ['Kto kieruje przygotowaniem przedstawienia?', 'reżyser'],
  ['Co oddziela scenę od widowni?', 'kurtyna'], ['Czego potrzebujesz, żeby wejść do teatru?', 'bilet'], ['Co mocno oświetla scenę?', 'reflektor'],
  ['Dzięki czemu z daleka dobrze widać aktorów?', 'lornetka'], ['Kto robi aktorom makijaż i fryzury?', 'charakteryzator']];
const SENT = [['Czy pada deszcz', '?'], ['Gdzie jest kurtyna', '?'], ['Kiedy zaczyna się przedstawienie', '?'], ['Uważaj na lawę', '!'],
  ['Zamknij drzwi', '!'], ['Skacz wysoko', '!'], ['Robo lubi teatr', '.'], ['Dziś świeci słońce', '.'], ['Magnes przyciąga spinacz', '.']];
const MARK = { '.': ['kropka', 'oznajmujące'], '?': ['pytajnik', 'pytające'], '!': ['wykrzyknik', 'rozkazujące'] };
const VWORDS = ['kurtyna', 'aktor', 'magnes', 'bilet', 'scena', 'lornetka', 'teatr', 'pogoda', 'kaczka', 'termometr', 'burza', 'robot', 'planeta', 'deszcz', 'łabędź'];
const MAG = [['📎', 'spinacz', true], ['🔑', 'klucz', true], ['🔩', 'śrubę', true], ['🧷', 'agrafkę', true], ['✏️', 'ołówek', false], ['🍎', 'jabłko', false],
  ['🧸', 'misia', false], ['📄', 'kartkę', false], ['🎈', 'balon', false]];
const INSTR = [['Czym mierzymy temperaturę?', 'termometrem'], ['Czym mierzymy prędkość wiatru?', 'wiatromierzem'],
  ['Czym mierzymy ilość opadów?', 'deszczomierzem'], ['Czym mierzymy ciśnienie?', 'barometrem']];
const DUCK = [['Kim okazało się brzydkie kaczątko?', 'pięknym łabędziem', ['pięknym łabędziem', 'dużą kaczką', 'szarą gęsią']],
  ['Kto napisał „Brzydkie kaczątko”?', 'Hans Christian Andersen', ['Hans Christian Andersen', 'Jan Brzechwa', 'Julian Tuwim']],
  ['Która pora roku była dla kaczątka najtrudniejsza?', 'zima', ['zima', 'wiosna', 'lato']],
  ['Czego uczy baśń?', 'Nie oceniaj innych po wyglądzie.', ['Nie oceniaj innych po wyglądzie.', 'Zawsze bądź najszybszy.', 'Zimą nie wychodź z domu.']]];

const mk = (q, ans, pool, extra = {}) => { const opts = shuffle([ans, ...sample(pool.filter(x => x !== ans), 2)]); return { q, opts, ok: opts.indexOf(ans), say: q, ...extra }; };
function numQ(q, r, extra = {}) {
  const cand = [...new Set([r + 1, r - 1, r + 2, r - 2, r + 10])].filter(x => x >= 0 && x !== r);
  const opts = shuffle([r, ...sample(cand, 2)]).map(String);
  return { q, opts, ok: opts.indexOf(String(r)), say: q, ...extra };
}
function genMath() {
  const k = rnd(7);
  if (k === 0) { const a = between(5, 9), b = between(11 - a, 9); return numQ('Ile to jest?', a + b, { show: `${a} + ${b}`, say: `Ile to jest ${a} dodać ${b}?`, after: `${a} + ${b} = ${a + b}` }); }
  if (k === 1) { const a = between(11, 18), b = between(a - 9, 9); return numQ('Ile to jest?', a - b, { show: `${a} − ${b}`, say: `Ile to jest ${a} odjąć ${b}?`, after: `${a} − ${b} = ${a - b}` }); }
  if (k === 2) {
    const n = pick(Array.from({ length: 78 }, (_, i) => i + 21).filter(x => x % 10)), tens = coin(), q = `Ile ${tens ? 'dziesiątek' : 'jedności'} ma liczba ${n}?`;
    return numQ(q, tens ? Math.floor(n / 10) : n % 10, { show: String(n), after: `${n} = ${Math.floor(n / 10) * 10} + ${n % 10}` });
  }
  if (k === 3) {

function builder() {

  const b = {
    x: 0, h: 3,
    col(x) { while (cols.length <= x) cols.push(Array(H).fill('.')); return cols[x]; },
    put(x, h, c) { if (h >= 1 && h <= H) b.col(x)[H - h] = c; return b; },
    row(x, h, len, c) { for (let i = 0; i < len; i++) b.put(x + i, h, c); return b; },
    ground(len, h = b.h) { for (let i = 0; i < len; i++) { b.col(b.x + i); for (let k = 1; k <= h; k++) b.put(b.x + i, k, '#'); } b.x += len; b.h = h; return b; },
    pit(len, lava = true) { for (let i = 0; i < len; i++) { b.col(b.x + i); if (lava) b.put(b.x + i, 1, 'L'); } b.x += len; return b; },

    done() { return { rows: Array.from({ length: H }, (_, r) => cols.map(c => c[r]).join('')), movers }; },
  };
  return b;

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f))));

  ov.innerHTML = `<div class="qcard"><h2>⏸ Pauza</h2><div class="row"><button class="btn green" data-r="go">▶ Graj dalej</button><button class="btn" data-r="again">Od początku</button><button class="btn" data-r="map">Mapa</button></div></div>`;
  ov.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const i = G.i; closeOv();

}
function toast(msg, ms) { toastEl.textContent = msg; toastEl.classList.remove('hide'); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.add('hide'), ms); }
function hud() {
  if (!G) return;
  $('#hudStage').textContent = `🚩 Etap ${G.stage}/${G.stages}`;
  $('#hudCoins').textContent = `🪙 ${G.coins}/${G.coinsTotal}`;
  $('#hudGem').textContent = G.gem ? '💎 ✓' : '💎 –';
  $('#hudTime').textContent = `⏱ ${fmt(G.time)}`;
  $('#hudDeaths').textContent = `💥 ${G.deaths}`;
  $('#hudSound').textContent = save.sound ? '🔊' : '🔇';
}

/* ================= rendering ================= */
function resize() {
  const stage = $('#stage'), w = stage.clientWidth;
  const small = matchMedia('(pointer: coarse), (max-width: 760px)').matches;
  const h = small ? Math.max(260, Math.min(window.innerHeight - 240, w * .95)) : Math.max(300, Math.min(w * 9 / 16, window.innerHeight - 190, 580));
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.height = h + 'px'; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  scale = small ? Math.min(h / (10 * T), w / (12 * T)) : Math.min(h / (11 * T), w / (13 * T));
}
addEventListener('resize', () => { if (G) resize(); });
function render(dt) {
  const s = scale * dpr, vw = cv.width / s, vh = cv.height / s, p = G.p, th = G.L.th;
  const tx = Math.max(0, Math.min(G.W * T - vw, p.x + PW / 2 - vw / 2 + p.face * vw * .08));
  const ty = vh >= H * T ? H * T - vh : Math.max(0, Math.min(H * T - vh, p.y + PH / 2 - vh * .55));
  if (!G.cam) G.cam = { x: tx, y: ty };
  G.cam.x += (tx - G.cam.x) * Math.min(1, dt * 7); G.cam.y += (ty - G.cam.y) * Math.min(1, dt * 5);
  let cx = G.cam.x, cy = G.cam.y;
  if (G.shake > 0) { cx += (Math.random() - .5) * 8; cy += (Math.random() - .5) * 8; }
  // sky
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, cv.height); g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#fff';
  for (const [sx, sy, sz] of STARS) { const x = ((sx * cv.width * 2 - cx * s * .15) % cv.width + cv.width) % cv.width; ctx.globalAlpha = .4 + .4 * Math.sin(G.t * 2 + sx * 40); ctx.fillRect(x, sy * cv.height * .8, sz * dpr, sz * dpr); }
  ctx.globalAlpha = 1;
  const px = cv.width * .78 - cx * s * .05, py = cv.height * .26, pr = 46 * s;
  ctx.fillStyle = th.planet; ctx.beginPath(); ctx.arc(px, py, pr, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 5 * s; ctx.beginPath(); ctx.ellipse(px, py + 4 * s, pr * 1.5, pr * .38, -.3, 0, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(px - pr * .35, py - pr * .35, pr * .25, 0, 7); ctx.fill();
  // world
  ctx.setTransform(s, 0, 0, s, -Math.round(cx * s), -Math.round(cy * s));
  ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(0,0,0,.35)';
  const c0 = Math.max(0, Math.floor(cx / T) - 1), c1 = Math.min(G.W - 1, Math.ceil((cx + vw) / T) + 1);
  for (let r = 0; r < H; r++) for (let c = c0; c <= c1; c++) drawTile(G.grid[r][c], c, r, th);
  for (const m of G.movers) drawMover(m, th);
  if (G.state !== 'dead') {
    const air = !p.on;
    drawAvatar(ctx, p.x + PW / 2, p.y + PH, .9, save.avatar, { face: p.face, walk: p.walk, air, squash: p.squash });
  }
  for (const q of G.parts) {
    ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.fillStyle = q.col;
    if (q.star) { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(G.t * 4); ctx.fillRect(-q.s, -1, q.s * 2, 2); ctx.fillRect(-1, -q.s, 2, q.s * 2); ctx.restore(); }
    else if (q.rot != null) { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot + G.t * 6); ctx.fillRect(-q.s / 2, -q.s / 2, q.s, q.s); ctx.strokeRect(-q.s / 2, -q.s / 2, q.s, q.s); ctx.restore(); }
    else ctx.fillRect(q.x - q.s / 2, q.y - q.s / 2, q.s, q.s);

}
function topColor(th, c) { return th.top === 'rainbow' ? `hsl(${(c * 28) % 360},80%,62%)` : th.top; }
function drawTile(ch, c, r, th) {
  if (ch === '.') return;
  const x = c * T, y = r * T, t = G.t;
  if (ch === '#') {
    ctx.fillStyle = th.dirt; ctx.fillRect(x, y, T, T);
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(x, y + T - 4, T, 4); ctx.fillRect(x + T - 3, y, 3, T);
    ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(x + 6, y + 14, 5, 5); ctx.fillRect(x + 19, y + 22, 4, 4);
    if (!solid(c, r - 1) && tileAt(c, r - 1) !== '#') {
      ctx.fillStyle = topColor(th, c); ctx.fillRect(x, y, T, 9);
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x, y, T, 2);
      ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(x, y + 8, T, 2);
    }
    ctx.strokeRect(x + .5, y + .5, T - 1, T - 1);
  } else if (ch === '=') {
    ctx.fillStyle = th.stone; ctx.fillRect(x, y, T, T);
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x, y, T, 4); ctx.fillRect(x, y, 3, T);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x, y + T - 4, T, 4); ctx.fillRect(x + T - 3, y, 3, T);
    ctx.strokeRect(x + .5, y + .5, T - 1, T - 1);
  } else if (ch === 'J') {
    const hit = G.padHit && G.padHit.c === c && G.padHit.r === r && t - G.padHit.t < .2;
    ctx.fillStyle = '#546E7A'; ctx.fillRect(x, y + 12, T, T - 12);
    ctx.strokeStyle = '#FFEB3B'; ctx.lineWidth = 2.5; ctx.beginPath();
    for (let k = 0; k <= 4; k++) ctx.lineTo(x + 8 + (k % 2) * 16, y + (hit ? 10 : 6) + k * 1.5 + 4);
    ctx.stroke(); ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(0,0,0,.35)';
    ctx.fillStyle = '#E53935'; ctx.fillRect(x + 2, y + (hit ? 8 : 2), T - 4, 6); ctx.strokeRect(x + 2.5, y + (hit ? 8.5 : 2.5), T - 5, 5);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 9px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('▲', x + T / 2, y + 28);
  } else if (ch === 'V') {
    const v = G.vanish.get(r * 1000 + c);
    if (v && v.s === 'gone') { ctx.strokeStyle = 'rgba(128,222,234,.35)'; ctx.setLineDash([4, 4]); ctx.strokeRect(x + 2, y + 2, T - 4, T - 4); ctx.setLineDash([]); ctx.strokeStyle = 'rgba(0,0,0,.35)'; return; }
    const j = v ? (Math.random() - .5) * 3 : 0;
    ctx.globalAlpha = v ? 1 - v.t * 1.4 : .92;
    ctx.fillStyle = '#4DD0E1'; ctx.fillRect(x + j, y, T, T);
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.moveTo(x + 4 + j, y + 22); ctx.lineTo(x + 20 + j, y + 4); ctx.lineTo(x + 26 + j, y + 4); ctx.lineTo(x + 10 + j, y + 22); ctx.fill();
    ctx.strokeRect(x + .5 + j, y + .5, T - 1, T - 1); ctx.globalAlpha = 1;
  } else if (ch === 'L') {
    const lg = ctx.createLinearGradient(0, y, 0, y + T); lg.addColorStop(0, '#FFB300'); lg.addColorStop(.5, '#FF7043'); lg.addColorStop(1, '#C62828');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(x, y + T);
    for (let k = 0; k <= 8; k++) ctx.lineTo(x + k * 4, y + 6 + Math.sin(t * 3 + (c * 8 + k) * .7) * 3);
    ctx.lineTo(x + T, y + T); ctx.fill();
    ctx.fillStyle = 'rgba(255,245,157,.8)'; const bb = (t * 0.8 + c * .37) % 1; ctx.beginPath(); ctx.arc(x + 10 + (c % 3) * 6, y + T - bb * 22, 2.5 * (1 - bb) + .5, 0, 7); ctx.fill();
  } else if (ch === '^') {
    ctx.fillStyle = '#B0BEC5';
    for (let k = 0; k < 2; k++) { ctx.beginPath(); ctx.moveTo(x + 2 + k * 14, y + T); ctx.lineTo(x + 9 + k * 14, y + 12); ctx.lineTo(x + 16 + k * 14, y + T); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = '#fff'; ctx.fillRect(x + 8, y + 12, 2, 3); ctx.fillRect(x + 22, y + 12, 2, 3);
  } else if (ch === 'o') {
    const wv = Math.abs(Math.cos(t * 4 + c * .6)) * 9 + 2, cy = y + 16 + Math.sin(t * 3 + c) * 2;
    ctx.fillStyle = '#FFC107'; ctx.beginPath(); ctx.ellipse(x + 16, cy, wv, 11, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FFE082'; ctx.fillRect(x + 16 - wv * .3, cy - 6, Math.max(1, wv * .3), 12);
  } else if (ch === 'D') {
    const cy = y + 16 + Math.sin(t * 2.5) * 3;
    ctx.fillStyle = '#4DD0E1'; ctx.beginPath(); ctx.moveTo(x + 16, cy - 12); ctx.lineTo(x + 28, cy - 2); ctx.lineTo(x + 16, cy + 12); ctx.lineTo(x + 4, cy - 2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.moveTo(x + 16, cy - 12); ctx.lineTo(x + 22, cy - 2); ctx.lineTo(x + 16, cy - 2); ctx.fill();
    if (Math.sin(t * 6) > .7) { ctx.fillStyle = '#fff'; ctx.fillRect(x + 24, cy - 12, 2, 6); ctx.fillRect(x + 22, cy - 10, 6, 2); }
  } else if (ch === 'X') {                      // red glowing trap block: touching it sends you back
    const glow = .55 + .25 * Math.sin(t * 6 + c);
    ctx.fillStyle = `rgba(255,23,68,${glow * .35})`; ctx.fillRect(x - 3, y - 3, T + 6, T + 6);
    ctx.fillStyle = '#FF1744'; ctx.fillRect(x + 2, y + 2, T - 4, T - 4);
    ctx.fillStyle = `rgba(255,205,210,${glow})`; ctx.fillRect(x + 5, y + 5, T - 10, 4);
    ctx.strokeRect(x + 2.5, y + 2.5, T - 5, T - 5);
  } else if (ch === 'K') {                      // checkpoint: a stage pad with a flag and the stage number
    const key = r * 1000 + c, on = G.active.has(key), n = G.kIndex.get(key);
    if (on) { ctx.fillStyle = `rgba(102,187,106,${.25 + .15 * Math.sin(t * 4)})`; ctx.fillRect(x - 2, y + 6, T + 4, T - 12); }
    ctx.fillStyle = on ? '#43A047' : '#90A4AE'; ctx.fillRect(x - 2, y + T - 7, T + 4, 7); ctx.strokeRect(x - 1.5, y + T - 6.5, T + 3, 6);
    ctx.fillStyle = on ? '#C8E6C9' : '#ECEFF1'; ctx.fillRect(x + 4, y + T - 5, T - 8, 2);
    ctx.fillStyle = '#ECEFF1'; ctx.fillRect(x + 6, y - 6, 3, T - 1); ctx.strokeRect(x + 6.5, y - 5.5, 2, T - 2);
    const wave = Math.sin(t * 5 + c) * 2;
    ctx.fillStyle = on ? '#43A047' : '#FFFFFF'; ctx.beginPath(); ctx.moveTo(x + 9, y - 4); ctx.lineTo(x + 30, y + 3 + wave); ctx.lineTo(x + 9, y + 10); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = on ? '#fff' : '#E53935'; ctx.font = 'bold 10px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(on ? '✓' : '?', x + 17, y + 7);

    ctx.fillStyle = '#5D4037'; ctx.fillRect(-18, -32, 5, 66); ctx.fillRect(13, -32, 5, 66); ctx.fillRect(-18, -36, 36, 6);
    for (let k = 0; k < 4; k++) { ctx.strokeStyle = `hsl(${(t * 120 + k * 60) % 360},90%,65%)`; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(0, 0, 12 - k * 3, 28 - k * 6, 0, t * 2 + k, t * 2 + k + 4.5); ctx.stroke(); }
    ctx.fillStyle = '#fff'; ctx.font = 'bold 9px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('META', 0, -39);

}
function drawMover(m, th) {
  const x = m.px, y = m.py;
  ctx.fillStyle = '#78909C'; ctx.fillRect(x, y, m.w, 14);
  ctx.fillStyle = '#FFCA28'; for (let k = 0; k < m.w; k += 12) ctx.fillRect(x + k, y + 9, 6, 5);
  ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(x, y, m.w, 3);
  ctx.strokeRect(x + .5, y + .5, m.w - 1, 13);
  ctx.fillStyle = '#B0BEC5'; ctx.beginPath(); ctx.arc(x + m.w / 2, y + 7, 3, 0, 7); ctx.fill();

/* ================= loop & input ================= */
function frame(now) {
  raf = requestAnimationFrame(frame);
  if (!G) return;
  let dt = Math.min(.05, (now - last) / 1000); last = now;
  if (G.state === 'play' || G.state === 'dead' || G.state === 'done') {
    acc += dt;
    while (acc >= 1 / 120) { update(1 / 120); acc -= 1 / 120; if (!G || G.state === 'quiz') { acc = 0; break; } }
  }
  if (!G) return;
  render(dt);
  if ((frame.h = (frame.h || 0) + dt) > .1) { frame.h = 0; hud(); }
}
function startLoop() { cancelAnimationFrame(raf); last = performance.now(); acc = 0; raf = requestAnimationFrame(frame); }
function stopLoop() { cancelAnimationFrame(raf); }
const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'jump', w: 'jump', W: 'jump', ' ': 'jump' };
addEventListener('keydown', e => {
  if (!G || play.hidden) return;
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { if (G.state === 'play') pause(); else if (G.state === 'pause') closeOv(); return; }
  const k = KEYMAP[e.key]; if (!k) return;
  e.preventDefault();
  if (G.state !== 'play') return;
  if (k === 'jump' && !I.jump) I.jumpPressed = true;
  I[k] = true;
});
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) I[k] = false; });
/* Touch: joystick (left thumb) sets left/right, jump button or the right part of the game view jumps. Every finger is tracked by pointerId. */
const jumpBtn = $('#ctrl .jump'), stage = $('#stage'), held = new Map(), stick = { id: null, ox: 0, oy: 0, el: null };
function syncPad() { const on = [...held.values()].includes('jump'); if (on && !I.jump) I.jumpPressed = true; I.jump = on; jumpBtn.classList.toggle('on', on); }
function stickDir(d) { I.left = d < 0; I.right = d > 0; }
function stickEnd() {
  if (!stick.el) return;
  stick.el.querySelector('.knob').style.transform = '';
  if (stick.el.classList.contains('float')) stick.el.classList.remove('on'); else { stick.el.style.left = ''; stick.el.style.top = ''; }
  stick.id = null; stick.el = null; stickDir(0);
}
function clearPad() { held.clear(); stickEnd(); I.left = I.right = I.jump = false; jumpBtn.classList.remove('on'); }
function attachStick(zone, el, accept) {
  zone.addEventListener('pointerdown', e => {
    if (stick.id != null || (accept && !accept(e))) return;
    e.preventDefault(); try { zone.setPointerCapture(e.pointerId); } catch (_) {}
    const r = zone.getBoundingClientRect();
    Object.assign(stick, { id: e.pointerId, ox: e.clientX, oy: e.clientY, el });
    el.style.left = (e.clientX - r.left) + 'px'; el.style.top = (e.clientY - r.top) + 'px'; el.classList.add('on');
  });
  zone.addEventListener('pointermove', e => {
    if (e.pointerId !== stick.id) return;
    const dx = Math.max(-46, Math.min(46, e.clientX - stick.ox)), dy = Math.max(-46, Math.min(46, e.clientY - stick.oy));
    el.querySelector('.knob').style.transform = `translate(${dx}px, ${dy}px)`;
    stickDir(dx < -12 ? -1 : dx > 12 ? 1 : 0);
  });

}
attachStick($('#stickzone'), $('#stick'));
const onView = e => e.target === cv && e.pointerType !== 'mouse' && G && G.state === 'play';
attachStick(stage, $('#stick2'), e => onView(e) && e.clientX - stage.getBoundingClientRect().left < stage.clientWidth * .5);
stage.addEventListener('pointerdown', e => {
  if (!onView(e) || e.clientX - stage.getBoundingClientRect().left < stage.clientWidth * .5) return;
  e.preventDefault(); try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  held.set(e.pointerId, 'jump'); syncPad();
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => stage.addEventListener(ev, e => { if (held.delete(e.pointerId)) syncPad(); }));
jumpBtn.addEventListener('pointerdown', e => { e.preventDefault(); try { jumpBtn.setPointerCapture(e.pointerId); } catch (_) {} held.set(e.pointerId, 'jump'); syncPad(); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => jumpBtn.addEventListener(ev, e => { held.delete(e.pointerId); syncPad(); }));
[jumpBtn, stage, $('#stickzone')].forEach(x => x.addEventListener('contextmenu', e => e.preventDefault()));
play.addEventListener('click', e => {
  const b = e.target.closest('.hud button'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'map') { if (G && G.state === 'quiz') return; showMap(); }
  if (a === 'pause') { if (G && G.state === 'play') pause(); else if (G && G.state === 'pause') closeOv(); }

});
document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.state === 'play') pause(); });
addEventListener('blur', () => clearPad());

window._obby = { get G() { return G; }, I, LEVELS, startLevel, update, BANKS, save: () => save, showMap };   // used by tests only
showMap();
