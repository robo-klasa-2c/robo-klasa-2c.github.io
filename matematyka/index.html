<!-- Anonymous visit counter (GoatCounter, no cookies); roboTrack(name) records an event such as a finished level. -->
<script data-goatcounter="https://robo-klasa-2c.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<script>window.roboTrack = function (n, t) { t = t || 0; try { var g = window.goatcounter; if (g && g.count) g.count({ path: n, title: n, event: true }); else if (t < 20) setTimeout(function () { roboTrack(n, t + 1); }, 500); } catch (e) {} };</script>
<!-- roboPlayer(section): once per device 'nowy gracz' on the first game start, then 'gracz wraca' at most once a day (only a date is stored). -->
<script>window.roboPlayer = function (s) { try { var k = 'robo-gracz-' + s, d = new Date().toDateString(), last = localStorage.getItem(k); if (last === d) return; localStorage.setItem(k, d); roboTrack(s + ' · ' + (last ? 'gracz wraca' : 'nowy gracz')); } catch (e) {} };</script>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../wspolne/robo.js?v=9c463f64"></script>
<script>
const { rnd, pick, shuffle, sample, coin, pt } = Robo;

/* ---------- helpers ---------- */
const between = (a, b) => a + rnd(b - a + 1);
function plural(n, one, few, many) {
  if (n === 1) return one;
  const d = n % 10, h = n % 100;
  return d >= 2 && d <= 4 && !(h >= 12 && h <= 14) ? few : many;
}
function numOpts(ans, k = 3, lo = 0, hi = 20, extra = []) {
  const cand = new Set();
  [...extra, ans + 1, ans - 1, ans + 2, ans - 2, ans + 10, ans - 10].forEach(x => { if (x !== ans && x >= lo && x <= hi) cand.add(x); });
  const arr = sample([...cand], k - 1);
  while (arr.length < k - 1) { const x = lo + rnd(hi - lo + 1); if (x !== ans && !arr.includes(x)) arr.push(x); }
  return shuffle([ans, ...arr]).map(x => ({ html: String(x), ok: x === ans }));
}
const wordOpts = (ans, all) => shuffle([ans, ...sample(all.filter(w => w !== ans), 2)]).map(w => ({ html: w, ok: w === ans }));
const eq = (html, small) => `<div class="eq"${small ? ' style="font-size:clamp(28px,6.5vw,52px)"' : ''}>${html}</div>`;
const Q = '<span class="q">?</span>';

/* ---------- pictures ---------- */
function blocks(n) {                      // tens as rods of 10, ones as single cubes
  const d = Math.floor(n / 10), j = n % 10;
  let s = '', x = 4;
  for (let i = 0; i < d; i++) {
    for (let k = 0; k < 10; k++) s += `<rect x="${x}" y="${4 + k * 9}" width="9" height="9" fill="#42A5F5" stroke="#1565C0" stroke-width="1"/>`;
    x += 14;
  }
  x += 8;
  for (let k = 0; k < j; k++) s += `<rect x="${x + (k % 5) * 12}" y="${85 - Math.floor(k / 5) * 12}" width="9" height="9" fill="#FFB300" stroke="#E65100" stroke-width="1"/>`;
  const w = x + 5 * 12 + 2;
  return `<svg viewBox="0 0 ${w} 98" style="height:140px;width:auto;max-width:100%" aria-hidden="true">${s}</svg>`;
}
function clock(h, m) {
  let s = `<circle cx="50" cy="50" r="46" fill="#fff" stroke="#1E88E5" stroke-width="5"/>`;
  for (let i = 0; i < 60; i++) {
    const a = i / 60 * 2 * Math.PI - Math.PI / 2, [x1, y1] = pt(50, 50, 43, a), [x2, y2] = pt(50, 50, i % 5 ? 41 : 39, a);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#90A4AE" stroke-width="${i % 5 ? .8 : 1.6}"/>`;
  }
  for (let i = 1; i <= 12; i++) {
    const [x, y] = pt(50, 50, 32, i / 12 * 2 * Math.PI - Math.PI / 2);
    s += `<text x="${x}" y="${(+y + 4.3).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" font-family="Andika, sans-serif" fill="#263238">${i}</text>`;
  }
  const ma = m / 60 * 2 * Math.PI - Math.PI / 2, ha = ((h % 12) + m / 60) / 12 * 2 * Math.PI - Math.PI / 2;
  const [hx, hy] = pt(50, 50, 21, ha), [mx, my] = pt(50, 50, 35, ma);
  s += `<line x1="50" y1="50" x2="${hx}" y2="${hy}" stroke="#E53935" stroke-width="5" stroke-linecap="round"/>
        <line x1="50" y1="50" x2="${mx}" y2="${my}" stroke="#1E88E5" stroke-width="3.2" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="3.5" fill="#FDD835" stroke="#333" stroke-width="1"/>`;
  return `<svg viewBox="0 0 100 100" class="big" aria-label="zegar">${s}</svg>`;
}
function pairDots(n) {
  const cols = Math.ceil(n / 2);
  let s = '';
  for (let i = 0; i < n; i++) {
    const c = Math.floor(i / 2), r = i % 2;
    s += `<circle cx="${12 + c * 22}" cy="${12 + r * 22}" r="8" fill="${n % 2 && i === n - 1 ? '#FF7043' : '#42A5F5'}" stroke="#333" stroke-width="1.2"/>`;
  }
  for (let c = 0; c < Math.floor(n / 2); c++) s += `<rect x="${2 + c * 22}" y="2" width="20" height="42" rx="10" fill="none" stroke="#9575CD" stroke-width="1.5" stroke-dasharray="3 2"/>`;
  return `<svg viewBox="0 0 ${cols * 22 + 4} 46" style="height:70px;width:auto;max-width:100%" aria-hidden="true">${s}</svg>`;
}

/* ---------- story problems (numbers keep Polish plural forms correct) ---------- */
const STORY_ADD = [
  (a, b) => [`Z dębu spadło ${a} żołędzi, a potem jeszcze ${b}. Ile żołędzi spadło razem?`, s => `Razem spadło ${s} żołędzi.`, `${a} acorns fell from an oak tree, and then ${b} more. How many acorns fell altogether?`],
  (a, b) => [`Ola miała ${a} naklejek. Dostała jeszcze ${b} naklejek. Ile naklejek ma teraz?`, s => `Ola ma teraz ${s} naklejek.`, `Ola had ${a} stickers. She got ${b} more stickers. How many stickers does she have now?`],
  (a, b) => [`Na łące było ${a} motyli. Przyleciało jeszcze ${b} motyli. Ile motyli jest teraz na łące?`, s => `Na łące jest ${s} motyli.`, `There were ${a} butterflies in the meadow. ${b} more flew in. How many butterflies are in the meadow now?`],
];
const STORY_SUB = [
  (a, b) => [`W przedziale pociągu było ${a} osób. Na stacji wysiadło ${b} osób. Ile osób zostało?`,
             r => `${plural(r, 'Została', 'Zostały', 'Zostało')} ${r} ${plural(r, 'osoba', 'osoby', 'osób')}.`, `There were ${a} people in the train compartment. ${b} people got off at the station. How many people are left?`],
  (a, b) => [`Kuba miał ${a} cukierków. Zjadł ${b} cukierków. Ile cukierków mu zostało?`,
             r => `${plural(r, 'Został', 'Zostały', 'Zostało')} mu ${r} ${plural(r, 'cukierek', 'cukierki', 'cukierków')}.`, `Kuba had ${a} sweets. He ate ${b} sweets. How many sweets does he have left?`],
  (a, b) => [`Na drzewie siedziało ${a} wróbli. Odleciało ${b} wróbli. Ile wróbli zostało na drzewie?`,
             r => `Na drzewie ${plural(r, 'został', 'zostały', 'zostało')} ${r} ${plural(r, 'wróbel', 'wróble', 'wróbli')}.`, `${a} sparrows were sitting in a tree. ${b} sparrows flew away. How many sparrows are left in the tree?`],
];
function story(add) {
  if (add) {
    const a = between(5, 10), b = between(5, Math.min(10, 20 - a)), s = a + b, [txt, aft, en] = pick(STORY_ADD)(a, b);
    return { key: 'sa' + a + b, t: 'Zadanie z treścią', p: 'Przeczytaj i policz.', say: txt, en, prompt: `<div class="stmt">${txt}</div>`,
      cls: 'three', after: `${a} + ${b} = ${s}. ${aft(s)}`, options: numOpts(s, 3, 0, 20) };
  }
  const a = between(10, 18), b = between(5, a - 1), r = a - b, [txt, aft, en] = pick(STORY_SUB)(a, b);
  return { key: 'ss' + a + b, t: 'Zadanie z treścią', p: 'Przeczytaj i policz.', say: txt, en, prompt: `<div class="stmt">${txt}</div>`,
    cls: 'three', after: `${a} − ${b} = ${r}. ${aft(r)}`, options: numOpts(r, 3, 0, 20) };
}

/* ---------- level generators ---------- */
function genAdd(i) {
  const mode = i % 5;
  if (mode === 0) {
    let a, b;
    if (coin()) { a = between(3, 9); b = between(11 - a, 9); } else { a = between(11, 15); b = between(1, 19 - a); }
    return { key: 'a0' + a + b, t: 'Oblicz sumę', p: 'Ile to jest?', say: `Ile to jest ${a} dodać ${b}?`, en: `What is ${a} plus ${b}?`,
      prompt: eq(`${a} + ${b} = ${Q}`), cls: 'three', after: `${a} + ${b} = ${a + b}`, options: numOpts(a + b) };
  }
  if (mode === 1) {
    const a = between(3, 12), b = between(2, Math.min(9, 20 - a)), s = a + b;
    return { key: 'a1' + a + b, t: 'Jakiej liczby brakuje?', p: 'Uzupełnij składnik.', say: `${a} dodać ile równa się ${s}?`, en: `${a} plus what equals ${s}?`,
      prompt: eq(`${a} + ${Q} = ${s}`), cls: 'three', after: `${a} + ${b} = ${s}, bo ${s} − ${a} = ${b}`, options: numOpts(b, 3, 0, 10) };
  }
  if (mode === 2) {
    const a = between(6, 9), b = between(11 - a, 9), r = b - (10 - a);
    return { key: 'a2' + a + b, t: 'Dodaj przez dziesiątkę', p: `Najpierw dopełnij do 10.`, say: `${a} dodać ${b} to ${a} dodać ${10 - a} dodać ile?`, en: `${a} plus ${b} is ${a} plus ${10 - a} plus what?`,
      prompt: eq(`${a} + ${b} = ${a} + ${10 - a} + ${Q}`, true), cls: 'three',
      after: `${a} + ${b} = ${a} + ${10 - a} + ${r} = 10 + ${r} = ${a + b}`, options: numOpts(r, 3, 0, 9) };
  }
  if (mode === 3) {
    const a = between(2, 9), b = between(2, 9), s = a + b, which = pick(['a', 'b', 's']);
    const hl = (v, w) => which === w ? `<span class="hl">${v}</span>` : v;
    const ans = which === 's' ? 'suma' : 'składnik';
    return { key: 'a3' + a + b + which, t: 'Jak się nazywa zaznaczona liczba?', p: 'Nazwy liczb w dodawaniu.', say: 'Jak się nazywa zaznaczona liczba?', en: 'What is the highlighted number called in addition?',
      prompt: eq(`${hl(a, 'a')} + ${hl(b, 'b')} = ${hl(s, 's')}`), cls: 'three', after: 'składnik dodać składnik równa się suma',
      review: 'składnik + składnik = suma', options: wordOpts(ans, ['składnik', 'suma', 'różnica']) };
  }
  return story(true);
}
function genSub(i) {
  const mode = i % 6;
  if (mode === 0) {
    let a, b;
    if (coin()) { a = between(11, 18); b = between(a - 9, 9); } else { a = between(11, 19); b = between(1, a % 10 || 1); }
    return { key: 's0' + a + b, t: 'Oblicz różnicę', p: 'Ile to jest?', say: `Ile to jest ${a} odjąć ${b}?`, en: `What is ${a} minus ${b}?`,
      prompt: eq(`${a} − ${b} = ${Q}`), cls: 'three', after: `${a} − ${b} = ${a - b}`, options: numOpts(a - b) };
  }
  if (mode === 1) {
    const a = between(4, 10), b = between(1, a - 1);
    return { key: 's1' + a + b, t: `Różnica liczb ${a} i ${b} to…`, p: 'Różnica to wynik odejmowania.', say: `Różnica liczb ${a} i ${b} to?`, en: `What is the difference between ${a} and ${b}?`,
      prompt: eq(`${a} i ${b} → ${a} − ${b} = ${Q}`, true), cls: 'three', after: `${a} − ${b} = ${a - b}`, options: numOpts(a - b, 3, 0, 10, [a + b]) };
  }
  if (mode === 2) {
    const a = between(11, 17), j = a - 10, b = between(j + 1, 9), r = b - j;
    return { key: 's2' + a + b, t: 'Odejmij przez dziesiątkę', p: 'Najpierw odejmij do 10.', say: `${a} odjąć ${b} to ${a} odjąć ${j} odjąć ile?`, en: `${a} minus ${b} is ${a} minus ${j} minus what?`,
      prompt: eq(`${a} − ${b} = ${a} − ${j} − ${Q}`, true), cls: 'three',
      after: `${a} − ${b} = ${a} − ${j} − ${r} = 10 − ${r} = ${a - b}`, options: numOpts(r, 3, 0, 9) };
  }
  if (mode === 3) {
    const a = between(5, 19), b = between(1, a - 1), r = a - b, which = pick(['a', 'b', 'r']);
    const hl = (v, w) => which === w ? `<span class="hl">${v}</span>` : v;
    const ans = { a: 'odjemna', b: 'odjemnik', r: 'różnica' }[which];
    return { key: 's3' + a + b + which, t: 'Jak się nazywa zaznaczona liczba?', p: 'Nazwy liczb w odejmowaniu.', say: 'Jak się nazywa zaznaczona liczba?', en: 'What is the highlighted number called in subtraction?',
      prompt: eq(`${hl(a, 'a')} − ${hl(b, 'b')} = ${hl(r, 'r')}`), cls: 'three', after: 'odjemna odjąć odjemnik równa się różnica',
      review: 'odjemna − odjemnik = różnica', options: wordOpts(ans, ['odjemna', 'odjemnik', 'różnica']) };
  }
  if (mode === 4) {
    const a = between(12, 19), b = between(2, 7), r = a - b;
    return { key: 's4' + a + b, t: 'Sprawdź odejmowanie dodawaniem', p: 'Uzupełnij sprawdzenie.', say: `${a} odjąć ${b} równa się ${r}, bo ${r} dodać ${b} równa się ile?`, en: `${a} minus ${b} equals ${r}, because ${r} plus ${b} equals what?`,
      prompt: eq(`${a} − ${b} = ${r}, bo ${r} + ${b} = ${Q}`, true), cls: 'three', after: `${r} + ${b} = ${a}`, options: numOpts(a, 3, 0, 20) };
  }
  return story(false);
}
// number one as a word, so the reader says "jedna dziesiątka" / "jedną jedność" (digits make voices guess the gender)
const one = (n, w, txt) => n === 1 ? `${w} ${txt}` : `${n} ${txt}`;
function genTens(i) {
  const n = between(10, 39), d = Math.floor(n / 10), j = n % 10, mode = i % 4;
  const swapped = j * 10 + d;
  if (mode === 0) return { key: 't0' + n, t: 'Jaka to liczba?', p: 'Niebieski słupek = 1 dziesiątka, żółta kostka = 1 jedność.', say: 'Jaka to liczba?', en: 'What number is this? A blue rod is one ten, a yellow cube is one unit.',
    prompt: blocks(n), cls: 'three', after: `${one(d, 'jedna', plural(d, 'dziesiątka', 'dziesiątki', 'dziesiątek'))} i ${one(j, 'jedna', plural(j, 'jedność', 'jedności', 'jedności'))} to ${n}`,
    options: numOpts(n, 3, 10, 99, swapped !== n && j > 0 ? [swapped] : []) };
  if (mode === 1) return { key: 't1' + n, t: `Ile dziesiątek ma liczba ${n}?`, p: 'Dziesiątki to pierwsza cyfra.', say: `Ile dziesiątek ma liczba ${n}?`, en: `How many tens are in the number ${n}?`,
    prompt: eq(`<span class="hl">${d}</span>${j}`), cls: 'three', after: `Liczba ${n} ma ${one(d, 'jedną', plural(d, 'dziesiątkę', 'dziesiątki', 'dziesiątek'))}.`,
    options: numOpts(d, 3, 0, 9, [j]) };
  if (mode === 2) return { key: 't2' + n, t: `Ile jedności ma liczba ${n}?`, p: 'Jedności to ostatnia cyfra.', say: `Ile jedności ma liczba ${n}?`, en: `How many units are in the number ${n}?`,
    prompt: eq(`${d}<span class="hl">${j}</span>`), cls: 'three', after: `Liczba ${n} ma ${one(j, 'jedną', plural(j, 'jedność', 'jedności', 'jedności'))}.`,
    options: numOpts(j, 3, 0, 9, [d]) };
  return { key: 't3' + n, t: 'Jaka to liczba?', p: 'd – dziesiątki, j – jedności.', say: `${one(d, 'jedna', plural(d, 'dziesiątka', 'dziesiątki', 'dziesiątek'))} i ${one(j, 'jedna', plural(j, 'jedność', 'jedności', 'jedności'))} to jaka liczba?`, en: `${d} ${d === 1 ? 'ten' : 'tens'} and ${j} ${j === 1 ? 'unit' : 'units'}. What number is it?`,
    prompt: eq(`${d} d  i  ${j} j`), cls: 'three', after: `${one(d, 'jedna', plural(d, 'dziesiątka', 'dziesiątki', 'dziesiątek'))} i ${one(j, 'jedna', plural(j, 'jedność', 'jedności', 'jedności'))} to ${n}`, review: `${d} d i ${j} j = ${n}`,
    options: numOpts(n, 3, 1, 99, swapped !== n && j > 0 ? [swapped, d + j] : [d + j]) };
}

const NOM = ['', 'pierwsza', 'druga', 'trzecia', 'czwarta', 'piąta', 'szósta', 'siódma', 'ósma', 'dziewiąta', 'dziesiąta', 'jedenasta', 'dwunasta'];
const LOC = ['', 'pierwszej', 'drugiej', 'trzeciej', 'czwartej', 'piątej', 'szóstej', 'siódmej', 'ósmej', 'dziewiątej', 'dziesiątej', 'jedenastej', 'dwunastej'];
const nextH = h => h % 12 + 1;
function phrase(h, m) {
  if (m === 0) return `godzina ${NOM[h]}`;
  if (m === 15) return `kwadrans po ${LOC[h]}`;
  if (m === 30) return `wpół do ${LOC[nextH(h)]}`;
  return `za kwadrans ${NOM[nextH(h)]}`;
}
const enPhrase = (h, m) => m === 0 ? `${h} o'clock` : m === 15 ? `quarter past ${h}` : m === 30 ? `half past ${h}` : `quarter to ${nextH(h)}`;
const digital = (h, m) => `${h}:${m === 0 ? '00' : m}`;
const CLOCK_FACTS = [
  ['Ile minut ma kwadrans?', '15', ['15', '30', '45'], 'Kwadrans to 15 minut.', 'How many minutes are in a quarter of an hour?'],
  ['Ile minut ma pół godziny?', '30', ['15', '30', '50'], 'Pół godziny to 30 minut.', 'How many minutes are in half an hour?'],
  ['Ile minut ma godzina?', '60', ['30', '60', '100'], 'Godzina ma 60 minut.', 'How many minutes are in an hour?'],
  ['Co pokazuje krótka wskazówka?', 'godziny', ['godziny', 'minuty', 'sekundy'], 'Krótka wskazówka pokazuje godziny.', 'What does the short hand show?'],
  ['Co pokazuje długa wskazówka?', 'minuty', ['godziny', 'minuty', 'dni'], 'Długa wskazówka pokazuje minuty.', 'What does the long hand show?'],
  ['Długa wskazówka pokazuje liczbę 3. Ile minut minęło?', '15', ['3', '15', '30'], '3 razy 5 minut to 15 minut.', 'The long hand points to 3. How many minutes have passed?'],
  ['Długa wskazówka pokazuje liczbę 6. Ile minut minęło?', '30', ['6', '30', '60'], '6 razy 5 minut to 30 minut.', 'The long hand points to 6. How many minutes have passed?'],
  ['Długa wskazówka pokazuje liczbę 9. Ile minut minęło?', '45', ['9', '40', '45'], '9 razy 5 minut to 45 minut.', 'The long hand points to 9. How many minutes have passed?'],
  ['Długa wskazówka pokazuje liczbę 4. Ile minut minęło?', '20', ['4', '20', '40'], '4 razy 5 minut to 20 minut.', 'The long hand points to 4. How many minutes have passed?'],
];
function genClock(i) {
  const h = between(1, 12), m = pick([0, 15, 30, 45]), mode = i % 4;
  const others = [0, 15, 30, 45].filter(x => x !== m);
  if (mode === 0) {
    const opts = shuffle([[h, m], [h, pick(others)], [nextH(h), m]].map(([a, b]) => phrase(a, b)));
    const ans = phrase(h, m);
    return { key: 'c0' + h + m, t: 'Która godzina?', p: 'Najpierw krótka wskazówka (godziny), potem długa (minuty).', say: 'Która godzina?', en: 'What time is it?',
      prompt: clock(h, m), cls: 'list', after: `Jest ${ans}.`, options: [...new Set(opts)].map(o => ({ html: o, ok: o === ans })) };
  }
  if (mode === 1) {
    const ans = digital(h, m), opts = [...new Set([ans, digital(h, pick(others)), digital(nextH(h), m), digital(h === 1 ? 12 : h - 1, m)])].slice(0, 3);
    return { key: 'c1' + h + m, t: 'Która godzina?', p: 'Wybierz zapis na zegarze elektronicznym.', say: 'Która godzina?', en: 'What time is it? Choose the digital clock.',
      prompt: clock(h, m), cls: 'three', after: `${ans}, czyli ${phrase(h, m)}.`, options: shuffle(opts).map(o => ({ html: o, ok: o === ans })) };
  }
  if (mode === 2) {
    const mm = pick([15, 30, 45]), ans = digital(h, mm), trap = mm === 15 ? digital(nextH(h), 15) : mm === 30 ? digital(nextH(h), 30) : digital(nextH(h), 45);
    const opts = [...new Set([ans, trap, digital(h, mm === 30 ? 15 : 30)])];
    return { key: 'c2' + h + mm, t: `Która to godzina: „${phrase(h, mm)}”?`, p: 'Uwaga: „wpół do czwartej” to jeszcze trzecia!', say: `Która to godzina: ${phrase(h, mm)}?`, en: `What time is ${enPhrase(h, mm)}?`,
      prompt: `<div class="stmt">${phrase(h, mm)}</div>`, cls: 'three', after: `${phrase(h, mm)} to ${ans}.`, options: shuffle(opts).map(o => ({ html: o, ok: o === ans })) };

    const more = coin(), [e, w] = pick(more ? BIG : SMALL), others = sample(more ? SMALL : BIG, 2);
    const q = `Co zmieści ${more ? 'więcej' : 'mniej'} niż jeden litr wody?`;
    return { key: 'L3' + w + more, t: q, p: 'Pomyśl, ile litrowych butelek wlałbyś do środka.', say: q, en: `What holds ${more ? 'more' : 'less'} than one litre of water?`, prompt: '', cls: 'three',
      after: `${w[0].toUpperCase() + w.slice(1)} zmieści ${more ? 'więcej' : 'mniej'} niż litr.`,
      options: shuffle([[e, w], ...others]).map(([ee, ww]) => ({ html: `<span style="font-size:1.6em">${ee}</span><br>${ww}`, ok: ww === w })) };
  }
  if (mode === 4) {                                        // story with litres
    const f = pick(STORY_L), add = f(1, 1)[1];
    const a = add ? between(3, 12) : between(8, 18), b = add ? between(2, Math.min(8, 20 - a)) : between(2, Math.min(8, a - 1)), r = add ? a + b : a - b;
    const [txt, , aft, en] = f(a, b);
    return { key: 'L4' + a + b + add, t: 'Zadanie z treścią', p: 'Przeczytaj i policz litry.', say: txt, en, prompt: `<div class="stmt">${txt}</div>`, cls: 'three',
      after: `${a} ${add ? '+' : '−'} ${b} = ${r}. ${aft(r)}`, options: lOpts(r, 0, 20) };
  }
  if (coin()) {                                            // compare amounts
    const a = between(1, 9); let b; do { b = between(1, 9); } while (b === a);
    const q = 'Gdzie jest więcej soku?';
    return { key: 'L5' + a + b, t: q, p: 'Porównaj liczby litrów.', en: `Where is more juice? In a container with ${lEn(a)}, or in a container with ${lEn(b)}?`, say: `${q} W baniaku z ${a === 1 ? 'jednym litrem' : litry(a).replace('litry', 'litrami').replace('litrów', 'litrami')}, czy w baniaku z ${b === 1 ? 'jednym litrem' : litry(b).replace('litry', 'litrami').replace('litrów', 'litrami')}?`,
      prompt: '', cls: 'two', after: `${litry(Math.max(a, b))} to więcej niż ${Math.min(a, b) === 1 ? 'jeden litr' : litry(Math.min(a, b))}.`, options: [a, b].map(v => ({ html: `🧃 ${v} l`, ok: v === Math.max(a, b) })) };
  }
  const [q, ans, opts, aft, en] = pick(LITRE_FACTS);
  return { key: 'L6' + q, t: q, p: 'Litr i pojemność.', say: q, en, prompt: '', cls: 'list', after: aft, options: shuffle(opts).map(o => ({ html: o, ok: o === ans })) };
}

/* ---------- multiplication (products up to 30) ---------- */
const MUL_ITEMS = ['🍎', '⭐', '🌸', '🍪', '🚗', '🐞', '🍓', '🎈'];
function groups(a, b, e) {                 // a groups of b things, each group in a dashed box
  const box = `<span style="display:inline-flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px;width:${b > 4 ? 96 : b > 2 ? 72 : 48}px;min-height:48px;padding:6px;border:3px dashed #9575CD;border-radius:14px;font-size:24px;line-height:1.1">${e.repeat(b)}</span>`;
  return `<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:520px;margin:auto">${Array(a).fill(box).join('')}</div>`;
}
function mulPair() {                       // two factors, product at most 30
  const a = between(2, 6), b = between(2, Math.min(10, Math.floor(30 / a)));
  return coin() ? [a, b] : [b, a];
}
const verbMa = n => plural(n, 'ma', 'mają', 'ma');
const STORY_MUL = [                        // [fixed factor (or 0 = random), max count, text, after, English]
  [4, 7, (a, b, p) => [`Kot ma 4 łapy. Ile łap ${verbMa(a)} ${a} ${plural(a, 'kot', 'koty', 'kotów')}?`,
    `${a} × 4 = ${p}. ${a} ${plural(a, 'kot', 'koty', 'kotów')} ${verbMa(a)} ${p} ${plural(p, 'łapę', 'łapy', 'łap')}.`, `A cat has 4 legs. How many legs do ${a} cats have?`]],
  [2, 10, (a, b, p) => [`Rower ma 2 koła. Ile kół ${verbMa(a)} ${a} ${plural(a, 'rower', 'rowery', 'rowerów')}?`,
    `${a} × 2 = ${p}. ${a} ${plural(a, 'rower', 'rowery', 'rowerów')} ${verbMa(a)} ${p} ${plural(p, 'koło', 'koła', 'kół')}.`, `A bike has 2 wheels. How many wheels do ${a} bikes have?`]],
  [5, 6, (a, b, p) => [`Jedna ręka ma 5 palców. Ile palców ${verbMa(a)} ${a} ${plural(a, 'ręka', 'ręce', 'rąk')}?`,
    `${a} × 5 = ${p}. ${a} ${plural(a, 'ręka', 'ręce', 'rąk')} ${verbMa(a)} ${p} ${plural(p, 'palec', 'palce', 'palców')}.`, `One hand has 5 fingers. How many fingers do ${a} hands have?`]],
  [8, 3, (a, b, p) => [`Pająk ma 8 nóg. Ile nóg ${verbMa(a)} ${a} ${plural(a, 'pająk', 'pająki', 'pająków')}?`,
    `${a} × 8 = ${p}. ${a} ${plural(a, 'pająk', 'pająki', 'pająków')} ${verbMa(a)} ${p} ${plural(p, 'nogę', 'nogi', 'nóg')}.`, `A spider has 8 legs. How many legs do ${a} spiders have?`]],
  [3, 10, (a, b, p) => [`Trójkąt ma 3 boki. Ile boków ${verbMa(a)} ${a} ${plural(a, 'trójkąt', 'trójkąty', 'trójkątów')}?`,
    `${a} × 3 = ${p}. ${a} ${plural(a, 'trójkąt', 'trójkąty', 'trójkątów')} ${verbMa(a)} ${p} ${plural(p, 'bok', 'boki', 'boków')}.`, `A triangle has 3 sides. How many sides do ${a} triangles have?`]],
  [0, 5, (a, b, p) => [`Ania ma ${a} ${plural(a, 'pudełko', 'pudełka', 'pudełek')} kredek. W każdym pudełku ${plural(b, 'jest', 'są', 'jest')} ${b} ${plural(b, 'kredka', 'kredki', 'kredek')}. Ile kredek ma Ania?`,
    `${a} × ${b} = ${p}. Ania ma ${p} ${plural(p, 'kredkę', 'kredki', 'kredek')}.`, `Ania has ${a} boxes of crayons. There are ${b} crayons in each box. How many crayons does Ania have?`]],
];
function genMul(i) {
  const mode = i % 6;
  if (mode === 0) {                                        // compute
    const [a, b] = mulPair(), p = a * b;
    return { key: 'm0' + a + 'x' + b, t: 'Ile to jest?', p: 'Mnożenie to szybkie dodawanie tych samych liczb.', say: `Ile to jest ${a} razy ${b}?`, en: `What is ${a} times ${b}?`,
      prompt: eq(`${a} × ${b} = ${Q}`), cls: 'three', after: `${a} × ${b} = ${p}`, options: numOpts(p, 3, 0, 30, [a + b, p + a, p - b]) };
  }
  if (mode === 1) {                                        // picture: a groups of b
    const a = between(2, 5), b = between(2, Math.min(6, Math.floor(30 / a))), p = a * b, e = pick(MUL_ITEMS);
    return { key: 'm1' + a + 'x' + b, t: 'Ile jest razem?', p: 'Policz grupy i ile jest w jednej grupie.', say: 'Ile jest razem? Policz grupy i ile jest w jednej grupie.',
      en: `How many are there altogether? There are ${a} groups of ${b}.`, prompt: groups(a, b, e), cls: 'three',
      after: `${a} ${plural(a, 'grupa', 'grupy', 'grup')} po ${b}: ${a} × ${b} = ${p}`, options: numOpts(p, 3, 0, 30, [a + b, p + b, p - b]) };
  }
  if (mode === 2) {                                        // repeated addition -> multiplication
    const a = between(2, 5), b = between(2, Math.min(9, Math.floor(30 / a))), p = a * b, adds = Array(a).fill(b).join(' + ');
    const ans = `${a} × ${b}`, opts = [...new Set([ans, `${a} + ${b}`, b !== a ? `${b} × ${b}` : `${a + 1} × ${b}`, `${a + 1} × ${b}`])].slice(0, 3);
    return { key: 'm2' + a + 'x' + b, t: 'Które mnożenie pasuje?', p: 'Policz, ile razy dodajemy tę samą liczbę.', say: `Które mnożenie pasuje do dodawania: ${adds}?`,
      en: `Which multiplication matches ${Array(a).fill(b).join(' plus ')}?`, prompt: eq(`${adds}`, true), cls: 'three',
      after: `${adds} = ${a} × ${b} = ${p}`, options: shuffle(opts).map(o => ({ html: o, ok: o === ans })) };
  }
  if (mode === 3) {                                        // missing factor
    const [a, b] = mulPair(), p = a * b;
    return { key: 'm3' + a + 'x' + b, t: 'Jakiej liczby brakuje?', p: 'Pomyśl: ile razy trzeba wziąć tę liczbę?', say: `${a} razy ile równa się ${p}?`, en: `${a} times what equals ${p}?`,
      prompt: eq(`${a} × ${Q} = ${p}`), cls: 'three', after: `${a} × ${b} = ${p}`, options: numOpts(b, 3, 1, 10, [p - a, b + 1]) };
  }
  if (mode === 4) {                                        // story
    const [fix, maxA, f] = pick(STORY_MUL), a = between(2, maxA), b = fix || between(2, Math.min(6, Math.floor(30 / a))), p = a * b, [txt, aft, en] = f(a, b, p);
    return { key: 'm4' + txt.slice(0, 6) + a + 'x' + b, t: 'Zadanie z treścią', p: 'Przeczytaj i pomnóż.', say: txt, en, prompt: `<div class="stmt">${txt}</div>`, cls: 'three',
      after: aft, options: numOpts(p, 3, 0, 30, [a + b, p + b, p - b]) };
  }
  const [a, b] = mulPair(), p = a * b;                     // swapping the factors
  return { key: 'm5' + a + 'x' + b, t: 'Jakiej liczby brakuje?', p: 'Liczby w mnożeniu można zamienić miejscami.', say: `${a} razy ${b} to tyle samo, co ${b} razy ile?`,
    en: `${a} times ${b} is the same as ${b} times what?`, prompt: eq(`${a} × ${b} = ${b} × ${Q}`, true), cls: 'three',
    after: `${a} × ${b} = ${b} × ${a} = ${p}`, options: numOpts(a, 3, 1, 10, [b, p]) };
}
