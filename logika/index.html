<style>
  /* Page-only pieces: odd-one-out shapes, patterns, riddles and the three mini-games (sudoku, maze, memory). */
  .custom { margin-top: 12px; }
  .seq { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 7vw, 46px); letter-spacing: 2px; line-height: 1.3; }
  .seq b { color: #FF7043; }
  .maze .lava { animation: lava 1.6s ease-in-out infinite alternate; }
  @keyframes lava { to { opacity: .75; } }
  .prompt:empty { min-height: 0; margin: 8px 0; }
  .shape { width: 72px; height: 72px; }
  .emo { font-size: 56px; line-height: 1; }
  .riddle { font-size: clamp(20px, 3.8vw, 28px); font-weight: 700; line-height: 1.45; max-width: 640px; text-align: left; }
  .riddle .row { justify-content: flex-start; gap: 6px; margin-top: 6px; font-size: 44px; }
  .bot { width: 64px; height: 64px; margin: 0 auto; }
  .opt .lbl { display: block; font-size: 16px; color: var(--muted); }
  .opts.cols3 { grid-template-columns: repeat(3, 1fr); }
  .groups { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grp { border: 3px dashed #B0BEC5; border-radius: 16px; padding: 6px 8px; min-width: 52px; min-height: 60px; font-size: 30px;
         display: flex; flex-wrap: wrap; justify-content: center; align-content: center; max-width: 150px; line-height: 1.1; }
  .grp.q { font-family: var(--display); color: #FF7043; font-size: 40px; border-color: #FF7043; }
  .arrows { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }
  .arrows svg, .opt svg.arr { width: 58px; height: 58px; }
  .arrows .qm { font-family: var(--display); font-size: 48px; color: #FF7043; width: 58px; text-align: center; }
  .analogy { display: grid; grid-template-columns: auto auto auto; gap: 6px 14px; align-items: center; justify-content: center; font-size: 64px; line-height: 1.1; }
  .analogy .to { font-size: 34px; color: #90A4AE; }
  .analogy .qm { font-family: var(--display); color: #FF7043; font-size: 56px; text-align: center; }

  /* sudoku */
  .sdk { display: grid; grid-template-columns: repeat(4, auto); justify-content: center; gap: 5px; }
  .sdk button { width: min(19vw, 74px); height: min(19vw, 74px); border-radius: 14px; border: 3px solid var(--line); background: #fff;
                font-size: min(11vw, 44px); line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0; }
  .sdk button.given { background: #EEF3F6; border-color: #EEF3F6; cursor: default; }
  .sdk button.empty { border-style: dashed; }
  .sdk button.sel { border: 4px solid var(--gold); background: #FFF8E1; }
  .sdk button.done { background: #E8F5E9; border-color: #A5D6A7; animation: pop .35s; }
  .sdk button.bad { animation: shake .4s; background: #FFEBEE; }
  .sdk .c1 { margin-right: 9px; } .sdk .r1 { margin-bottom: 9px; }
  .palette { display: flex; justify-content: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .palette button { width: 70px; height: 70px; border-radius: 18px; border: 0; background: #FFE082; box-shadow: 0 5px 0 #FFA000; font-size: 40px; padding: 0; }
  .palette button.hint { animation: glow 1s infinite; }
  .help { text-align: center; color: var(--muted); font-size: 15px; margin-top: 10px; }

  /* maze */
  .maze { display: flex; justify-content: center; }
  .maze svg { width: min(100%, 300px); }
  .maze.bump svg { animation: shake .4s; }
  .prg { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px; min-height: 46px; margin: 12px auto 0; max-width: 520px;
         border: 3px dashed #B0BEC5; border-radius: 16px; padding: 5px; }
  .prg svg { width: 32px; height: 32px; background: #E3F2FD; border-radius: 8px; padding: 2px; }
  .prg svg.now { background: #FFE082; }
  .prg .empty { color: var(--muted); font-size: 15px; align-self: center; }
  .ctrl { display: flex; justify-content: center; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
  .pad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 64px); gap: 8px; }
  .pad button { border: 0; border-radius: 16px; background: #E3F2FD; box-shadow: 0 5px 0 #90CAF9; padding: 8px; }
  .pad button svg { width: 100%; height: 100%; }
  .pad .up { grid-column: 2; } .pad .left { grid-column: 1; grid-row: 2; } .pad .down { grid-column: 2; grid-row: 2; } .pad .right { grid-column: 3; grid-row: 2; }
  .runrow { display: flex; flex-direction: column; gap: 10px; }
  .runrow .btn { font-size: 18px; padding: 9px 18px; }
  .runrow .btn.grey { background: #90A4AE; box-shadow: 0 5px 0 #607D8B; }
  .pad button:disabled, .runrow button:disabled { opacity: .45; cursor: default; }

  /* memory */
  .mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 460px; margin: 0 auto; }
  .mem button { aspect-ratio: 1; border: 0; border-radius: 16px; font-size: min(10vw, 46px); padding: 0; display: flex; align-items: center; justify-content: center;
                background: linear-gradient(145deg, #5C6BC0, #3949AB); box-shadow: 0 5px 0 #283593; transition: transform .15s; }
  .mem button .back { width: 52%; height: 52%; }
  .mem button.up { background: #fff; box-shadow: 0 5px 0 var(--line); border: 3px solid var(--line); }
  .mem button.got { background: #E8F5E9; border: 3px solid #A5D6A7; box-shadow: 0 5px 0 #A5D6A7; cursor: default; animation: pop .35s; }
  .mem button.hint { animation: glow 1s infinite; }
  .mem button.txt { font-family: var(--display); font-weight: 600; font-size: min(4.8vw, 22px); line-height: 1.1; padding: 2px; }
  .analogy .w { font-size: clamp(18px, 4.6vw, 28px); font-weight: 700; text-align: center; }
  .opt .w { font-size: clamp(17px, 3.6vw, 22px); }

  @media (max-width: 560px) {
    .shape { width: 56px; height: 56px; } .emo { font-size: 46px; }
    .analogy { font-size: 50px; } .arrows svg, .opt svg.arr { width: 46px; height: 46px; }
    .grp { font-size: 24px; min-width: 44px; }
    .pad { grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); gap: 6px; }
    .ctrl { gap: 10px; } .runrow { gap: 8px; } .runrow .btn { font-size: 16px; padding: 7px 12px; }
    .maze svg { width: min(100%, 250px); }
    .palette button { width: 62px; height: 62px; font-size: 34px; }
  }
</style>
<!-- Anonymous visit counter (GoatCounter, no cookies); roboTrack(name) records an event such as a finished level. -->
<script data-goatcounter="https://robo-klasa-2c.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<script>window.roboTrack = function (n, t) { t = t || 0; try { var g = window.goatcounter; if (g && g.count) g.count({ path: n, title: n, event: true }); else if (t < 20) setTimeout(function () { roboTrack(n, t + 1); }, 500); } catch (e) {} };</script>

<body>
<div class="wrap" id="app"></div>
<script src="../wspolne/robo.js?v=5233cfd8"></script>
<script>
const { rnd, pick, shuffle, sample, coin } = Robo;
const between = (a, b) => a + rnd(b - a + 1);
const cap = s => s[0].toUpperCase() + s.slice(1);
const en = w => `<span lang="en">${w}</span>`;      // English words: read by an English voice
const emo = e => `<span class="emo">${e}</span>`;
function numOpts(ans, lo = 0, hi = 40) {
  const cand = [...new Set([ans + 1, ans - 1, ans + 2, ans - 2, ans + 4])].filter(x => x !== ans && x >= lo && x <= hi);
  return shuffle([ans, ...sample(cand, 2)]).map(x => ({ html: String(x), ok: x === ans }));
}

/* ---------- 1. Co nie pasuje? (teatr, pogoda, magnes – polski i przyroda; zabawki – angielski Unit 1; liczby i dni – matematyka) ---------- */
const CATS = [
  { pl: 'rzeczy z teatru', it: [['🎭', 'maska'], ['🎟️', 'bilet'], ['💺', 'fotel'], ['🔦', 'reflektor'], ['👗', 'kostium']] },
  { pl: 'zjawiska pogodowe', it: [['☀️', 'słońce'], ['🌧️', 'deszcz'], ['❄️', 'śnieg'], ['⛈️', 'burza'], ['💨', 'wiatr'], ['🌫️', 'mgła']] },
  { pl: 'zabawki – my favourite things', it: [['🚲', 'rower'], ['🛴', 'hulajnoga'], ['🤖', 'robot'], ['⚽', 'piłka'], ['🧸', 'miś'], ['🚂', 'pociąg'], ['🚀', 'statek kosmiczny']] },
  { pl: 'ptaki z baśni „Brzydkie kaczątko”', it: [['🦢', 'łabędź'], ['🦆', 'kaczka'], ['🐣', 'kaczątko'], ['🐔', 'kura']] },
];
const MAG_YES = [['📎', 'spinacz'], ['🔑', 'klucz'], ['✂️', 'nożyczki'], ['🔩', 'śrubę'], ['⛓️', 'łańcuch'], ['🧷', 'agrafkę']];
const MAG_NO = [['✏️', 'ołówek'], ['🍎', 'jabłko'], ['🧸', 'misia'], ['📄', 'kartkę'], ['🧦', 'skarpetkę'], ['🎈', 'balon'], ['🪵', 'kawałek drewna']];
const COLORS = [['#E53935', 'czerwona', 'red'], ['#1E88E5', 'niebieska', 'blue'], ['#FDD835', 'żółta', 'yellow'], ['#43A047', 'zielona', 'green']];
const SHAPES = ['circle', 'square', 'triangle', 'diamond'];
const DAYS = ['poniedziałek', 'wtorek', 'środa', 'czwartek', 'piątek', 'sobota', 'niedziela'];
const V_WORDS = ['aktor', 'aktorka', 'oko', 'ucho', 'osa', 'igła', 'ekran', 'ul', 'auto', 'ołówek'];
const C_WORDS = ['kurtyna', 'bilet', 'scena', 'maska', 'magnes', 'termometr', 'kaczka', 'łabędź', 'deszcz', 'widz'];
function shape(kind, col) {
  const S = `fill="${col}" stroke="#333" stroke-width="3" stroke-linejoin="round"`;
  const body = { circle: `<circle cx="50" cy="50" r="38" ${S}/>`, square: `<rect x="14" y="14" width="72" height="72" rx="6" ${S}/>`,
    triangle: `<polygon points="50,10 90,86 10,86" ${S}/>`, diamond: `<polygon points="50,6 92,50 50,94 8,50" ${S}/>` }[kind];
  return `<svg class="shape" viewBox="0 0 100 100" aria-hidden="true">${body}</svg>`;
}
const word = w => `<span class="w">${w}</span>`;
const oddOpts = (same, odd, html) => shuffle([...same.map(x => ({ html: html(x), ok: false })), { html: html(odd), ok: true }]);
function genOdd(i) {
  const mode = i % 4;
  if (mode === 0) {
    const [A, B] = sample(CATS, 2), items = sample(A.it, 3), odd = pick(B.it.filter(x => !A.it.some(y => y[0] === x[0])));
    return { key: 'o0' + odd[0] + items.map(x => x[0]).join(''), t: 'Co nie pasuje?', p: 'Trzy rzeczy są do siebie podobne. Jedna nie pasuje.',
      say: 'Co nie pasuje do reszty?', prompt: '', cls: 'pics', after: `${cap(odd[1])} nie pasuje, bo reszta to ${A.pl}.`,
      review: `${odd[0]} – reszta to ${A.pl}`, options: oddOpts(items.map(x => x[0]), odd[0], emo) };
  }
  if (mode === 1) {
    const many = coin(), same = sample(many ? MAG_YES : MAG_NO, 3), odd = pick(many ? MAG_NO : MAG_YES);
    const why = many ? `Magnes nie przyciągnie: ${odd[1]}. Resztę przyciągnie, bo jest z żelaza lub stali.` : `Magnes przyciągnie tylko ${odd[1]}. Reszty nie przyciągnie.`;
    return { key: 'o1' + odd[0] + same.map(x => x[0]).join(''), t: 'Co nie pasuje? Pomyśl o magnesie 🧲', p: 'Które rzeczy przyciąga magnes?',
      say: 'Co nie pasuje? Pomyśl, które rzeczy przyciąga magnes.', prompt: '', cls: 'pics', after: why, review: why,
      options: oddOpts(same.map(x => x[0]), odd[0], emo) };
  }
  if (mode === 2) {
    const byColor = coin(), [v, w] = sample(byColor ? COLORS : SHAPES, 2);
    const other = shuffle(byColor ? SHAPES : COLORS);      // all different, so only one attribute singles out an item
    const items = other.map((o, k) => ({ main: k === 3 ? w : v, o, odd: k === 3 }));
    return { key: 'o2' + byColor + v + w + other.join(''), t: 'Która figura nie pasuje?', p: 'Przyjrzyj się kolorom i kształtom.',
      say: 'Która figura nie pasuje do reszty?', prompt: '', cls: 'pics',
      after: byColor ? `Tylko ta figura jest ${w[1]}, po angielsku ${en(w[2])}.` : 'Tylko ta figura ma inny kształt.',
      options: shuffle(items.map(x => ({ html: byColor ? shape(x.o, x.main[0]) : shape(x.main, x.o[0]), ok: x.odd }))) };
  }
  const sub = rnd(4);
  let same, odd, why, t;
  if (sub === 0) {
    const even = coin(), pool = Array.from({ length: 19 }, (_, k) => k + 2).filter(n => n % 10 !== 0);
    same = sample(pool.filter(n => (n % 2 === 0) === even), 3); odd = pick(pool.filter(n => (n % 2 === 0) !== even));
    t = 'Która liczba nie pasuje?'; why = `Liczba ${odd} jest ${even ? 'nieparzysta' : 'parzysta'}, a reszta liczb jest ${even ? 'parzysta' : 'nieparzysta'}.`;
  } else if (sub === 1) {
    same = sample([10, 20, 30, 40, 50, 60, 70, 80, 90], 3); odd = between(11, 89); while (odd % 10 === 0) odd = between(11, 89);
    t = 'Która liczba nie pasuje?'; why = `Liczba ${odd} ma ${odd % 10} jedności, a reszta to pełne dziesiątki.`;
  } else if (sub === 2) {
    same = sample(DAYS.slice(0, 5), 3); odd = pick(DAYS.slice(5));
    t = 'Który dzień nie pasuje?'; why = `${cap(odd)} to dzień wolny od szkoły, a reszta to dni, kiedy chodzimy do szkoły.`;
  } else {
    same = sample(V_WORDS, 3); odd = pick(C_WORDS);
    t = 'Który wyraz nie pasuje?'; why = `Wyraz ${odd} zaczyna się od spółgłoski, a reszta od samogłoski.`;
  }
  return { key: 'o3' + odd + same.join(), t, p: 'Znajdź regułę, którą mają trzy odpowiedzi.', say: t, prompt: '', cls: sub < 2 ? 'pics' : 'pics long',
    after: why, review: why, options: oddOpts(same.map(String), String(odd), x => x) };
}

/* ---------- 2. Wzory i pary (liczby, zegar, dni tygodnia, słówka) ---------- */
const ANALOGY = [
  ['one', '1', 'five', '5', `${en('One')} to 1, a ${en('five')} to 5.`],
  ['red', 'czerwony', 'blue', 'niebieski', `${en('Red')} to czerwony, a ${en('blue')} to niebieski.`],
  ['ball', '⚽', 'teddy bear', '🧸', `${en('Ball')} to piłka, a ${en('teddy bear')} to miś.`],
  ['🐣', '🦢', '🐥', '🐔', 'Z brzydkiego kaczątka wyrósł łabędź, a z kurczątka wyrasta kura.'],
  ['termometr', 'temperatura', 'wiatromierz', 'prędkość wiatru', 'Termometr mierzy temperaturę, a wiatromierz prędkość wiatru.'],
  ['aktor', 'scena', 'widz', 'widownia', 'Aktor gra na scenie, a widz siedzi na widowni.'],
  ['kropka', 'zdanie oznajmujące', 'pytajnik', 'pytanie', 'Kropkę stawiamy na końcu zdania oznajmującego, a pytajnik na końcu pytania.'],
  ['poniedziałek', 'wtorek', 'sobota', 'niedziela', 'Po poniedziałku jest wtorek, a po sobocie niedziela.'],
  ['pół godziny', '30 minut', 'kwadrans', '15 minut', 'Pół godziny to 30 minut, a kwadrans to 15 minut.'],
  ['🌧️', '☂️', '☀️', '😎', 'Na deszcz bierzemy parasol, a na słońce okulary.'],
  ['N', 'biegun północny', 'S', 'biegun południowy', 'N to biegun północny magnesu, a S to biegun południowy.'],
];
const isWord = s => /[a-ząćęłńóśźż0-9]/i.test(s);
const cell = s => isWord(s) ? word(s) : `<span>${s}</span>`;
const hm = m => `${Math.floor(m / 60) % 12 || 12}:${String(m % 60).padStart(2, '0')}`;
function genPattern(i) {
  const mode = i % 3;
  if (mode === 0) {
    const s = pick(i < 4 ? [2, 5, 10] : [2, 5, 10, -2, -5, -10, 3]), len = 4;
    const a = s > 0 ? between(1, 100 - s * len) : between(-s * len, 100), seq = [0, 1, 2, 3].map(k => a + k * s), ans = a + len * s;
    const cand = [...new Set([ans + 1, ans - 1, ans + s, ans - s * 2, ans + 2, ans + 10])].filter(x => x !== ans && x >= 0 && x <= 110);
    return { key: 'w0' + a + s, t: 'Jaka liczba będzie dalej?', p: 'Znajdź regułę: o ile rosną albo maleją liczby?', say: 'Jaka liczba będzie dalej?',
      prompt: `<div class="seq">${seq.join(', ')}, <b>?</b></div>`, cls: 'three cols3',
      after: `Każda liczba jest ${s > 0 ? 'większa' : 'mniejsza'} o ${Math.abs(s)}, więc następna to ${ans}.`,
      options: shuffle([ans, ...sample(cand, 2)]).map(x => ({ html: String(x), ok: x === ans })) };
  }
  if (mode === 1) {
    if (coin()) {
      const st = between(1, 10) * 60 + pick([0, 15, 30]), step = pick([15, 30]), seq = [0, 1, 2, 3].map(k => hm(st + k * step)), ans = hm(st + 4 * step);
      const wrongs = [hm(st + 4 * step + 15), hm(st + 3 * step), hm(st + 4 * step + 60), hm(st + 5 * step)].filter(x => x !== ans && !seq.includes(x));
      return { key: 'w1' + st + step, t: 'Która godzina będzie dalej?', p: `Co ${step === 15 ? 'kwadrans' : 'pół godziny'}? Zobacz, o ile przesuwa się czas.`,
        say: 'Która godzina będzie dalej?', prompt: `<div class="seq">${seq.join(', ')}, <b>?</b></div>`, cls: 'three cols3',
        after: `Co ${step === 15 ? 'kwadrans, czyli 15 minut' : 'pół godziny, czyli 30 minut'}. Następna jest ${ans}.`,
        options: shuffle([ans, ...sample([...new Set(wrongs)], 2)]).map(x => ({ html: x, ok: x === ans })) };
    }
    const st = rnd(7), step = pick([1, 2]), seq = [0, 1, 2].map(k => DAYS[(st + k * step) % 7]), ans = DAYS[(st + 3 * step) % 7];
    return { key: 'w1d' + st + step, t: 'Jaki dzień będzie dalej?', p: step === 1 ? 'Dni tygodnia po kolei.' : 'Uwaga: tu jest co drugi dzień!',
      say: 'Jaki dzień będzie dalej?', prompt: `<div class="stmt">${seq.join(', ')}, <b style="color:#FF7043">?</b></div>`, cls: 'three cols3 long',
      after: step === 1 ? `Po kolei: potem jest ${ans}.` : `Co drugi dzień: potem jest ${ans}.`,
      options: shuffle([ans, ...sample(DAYS.filter(d => d !== ans && !seq.includes(d)), 2)]).map(x => ({ html: x, ok: x === ans })) };
  }
  const [a, b, c, d, why] = pick(ANALOGY), wrongs = sample(ANALOGY.map(x => x[3]).filter(x => x !== d && x !== b && x !== c), 2);
  return { key: 'w2' + a, t: 'Co pasuje do pary?', p: 'Pomyśl, co łączy pierwszą parę.', say: 'Co pasuje do drugiej pary? Pomyśl, co łączy pierwszą parę.',
    prompt: `<div class="analogy">${cell(a)}<span class="to">➜</span>${cell(b)}${cell(c)}<span class="to">➜</span><span class="qm">?</span></div>`,
    cls: 'three cols3 long', after: why, review: `${a} ➜ ${b}, ${c} ➜ ${d}`,
    options: shuffle([d, ...wrongs]).map(x => ({ html: isWord(x) ? word(x) : emo(x), ok: x === d })) };
}

/* ---------- 3. Zagadki (kolory i zabawki z angielskiego, kalendarz i zegar z matematyki, podwórko z baśni) ---------- */
const ROBO_COL = [['czerwony', '#EF5350', 'red'], ['niebieski', '#42A5F5', 'blue'], ['zielony', '#66BB6A', 'green'], ['żółty', '#FFEE58', 'yellow'], ['fioletowy', '#AB47BC', 'purple']];
const CMP = [['wyższy', 'najwyższy', 'najniższy'], ['szybszy', 'najszybszy', 'najwolniejszy'], ['cięższy', 'najcięższy', 'najlżejszy'], ['starszy', 'najstarszy', 'najmłodszy']];
const TOYS = [['🚲', 'rower', 'roweru', 'bike'], ['⚽', 'piłka', 'piłki', 'ball'], ['🤖', 'robot', 'robota', 'robot'], ['🧸', 'miś', 'misia', 'teddy bear'],
  ['🚂', 'pociąg', 'pociągu', 'train'], ['🛴', 'hulajnoga', 'hulajnogi', 'scooter'], ['🚀', 'statek', 'statku', 'spaceship']];
const LEGS = [['🐔', 'kura', 'kury', 'kur', 2], ['🦆', 'kaczka', 'kaczki', 'kaczek', 2], ['🐕', 'pies', 'psy', 'psów', 4], ['🐈', 'kot', 'koty', 'kotów', 4]];

      setTimeout(() => { [x, y].forEach(j => { const c = btn(j); if (c) { c.classList.remove('up'); c.innerHTML = BACK; } }); busy = false; }, 950);
    }
  });
}
